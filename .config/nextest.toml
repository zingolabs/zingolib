[test-groups]
# The testnet tests spend from one shared wallet, so they never overlap.
testnet = { max-threads = 1 }

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "30s" }

# The testnet tests lead the list: nextest applies the first matching override.
# Each testnet test waits for several real blocks of about 75 seconds.
[[profile.default.overrides]]
filter = 'binary(testnet)'
test-group = 'testnet'
slow-timeout = { period = "60s", terminate-after = 60, grace-period = "30s" }

[[profile.default.overrides]]
filter = 'package(libtonode-tests) | package(zingo-cli)'

# Long-chain heavies run close to the default limit.
[[profile.default.overrides]]
filter = '''
test(send_mined_ironwood_to_ironwood)
'''
slow-timeout = { period = "60s", terminate-after = 20, grace-period = "30s" }


[profile.ci]
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "30s" }

# The testnet tests lead the list: nextest applies the first matching override.
# Each testnet test waits for several real blocks of about 75 seconds.
[[profile.ci.overrides]]
filter = 'binary(testnet)'
test-group = 'testnet'
slow-timeout = { period = "60s", terminate-after = 60, grace-period = "30s" }

[[profile.ci.overrides]]
filter = 'package(libtonode-tests) | package(zingo-cli)'

# Long-chain heavies run close to the default limit.
[[profile.ci.overrides]]
filter = '''
test(send_mined_ironwood_to_ironwood)
'''
slow-timeout = { period = "60s", terminate-after = 20, grace-period = "30s" }
