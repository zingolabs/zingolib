[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "30s" }

[[profile.default.overrides]]
filter = 'package(libtonode-tests) | package(zingo-cli)'

# Builds a ~116-block chain.
[[profile.default.overrides]]
filter = 'test(store_all_checkpoints_in_verification_window)'
slow-timeout = { period = "60s", terminate-after = 30, grace-period = "30s" }

# Mines and scans a ~235-block leap past the first migration bucket boundary.
[[profile.default.overrides]]
filter = 'test(unavailable_boundary_tree_state_skips_without_sync)'
slow-timeout = { period = "60s", terminate-after = 20, grace-period = "30s" }

# Long-chain heavies run close to the default limit.
[[profile.default.overrides]]
filter = '''
test(mempool_spend_balance_and_note_status_accounting)
| test(sync_all_expressible_epochs)
| test(send_mined_ironwood_to_ironwood)
| test(multi_input_sapling_send_with_orchard_change_no_panic)
| test(send_shield_cycle)
| test(generate_a_range_of_value_transfers)
| test(drain_chunks_a_fragmented_wallet)
| test(immediate_migration_chunks_a_fragmented_wallet)
| test(from_t_z_o_tz_to_zo_tzo_to_orchard)
'''
slow-timeout = { period = "60s", terminate-after = 20, grace-period = "30s" }

[profile.ci]
failure-output = "immediate-final"
