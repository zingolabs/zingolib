[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "30s" }

[[profile.default.overrides]]
filter = 'package(libtonode-tests) | package(zingo-cli)'

# store_all_checkpoints_in_verification_window builds its ~116-block
# chain on the first run per machine (or under
# ZINGO_REGENERATE_CHAIN_CACHE): 507s measured solo, which clears the
# default 600s ceiling with no margin for container contention (this
# file documents 5-7x stretch under load). Replay runs (~24s) fit the
# normal budget untouched.
[[profile.default.overrides]]
filter = 'test(store_all_checkpoints_in_verification_window)'
slow-timeout = { period = "60s", terminate-after = 20, grace-period = "30s" }

# unavailable_boundary_tree_state_skips_without_sync generates and scans a
# ~460-block leap past the first migration bucket boundary (modulus 256,
# plus pruning depth), which ran past the 600s ceiling in container runs:
# it gets the same doubled ceiling as the chain-cache build above.
[[profile.default.overrides]]
filter = 'test(unavailable_boundary_tree_state_skips_without_sync)'
slow-timeout = { period = "60s", terminate-after = 20, grace-period = "30s" }

[profile.ci]
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "30s" }

[[profile.ci.overrides]]
filter = 'package(libtonode-tests) | package(zingo-cli)'

# Same first-run build allowance as the default profile (see above).
[[profile.ci.overrides]]
filter = 'test(store_all_checkpoints_in_verification_window)'
slow-timeout = { period = "60s", terminate-after = 20, grace-period = "30s" }

# Same boundary-leap allowance as the default profile (see above).
[[profile.ci.overrides]]
filter = 'test(unavailable_boundary_tree_state_skips_without_sync)'
slow-timeout = { period = "60s", terminate-after = 20, grace-period = "30s" }
