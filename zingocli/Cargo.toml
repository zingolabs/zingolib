[package]
name = "zingo-cli"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "zingo-cli-regtest"
path = "src/bin/zingo-cli-regtest.rs"
required-features = ["regtest"]

[features]
regtest = ["dep:zingo-infra-services", "dep:tempfile", "zingolib/testvectors"]

[dependencies]
zingolib = { workspace = true, features = ["test-elevation"] }
pepper-sync = { workspace = true }
zingo-infra-services = { workspace = true, optional = true }

zcash_protocol = { workspace = true }

bip0039 = { workspace = true }
clap = { workspace = true }
http = { workspace = true }
json = { workspace = true }
log = { workspace = true }
rustls = { workspace = true }
rustyline = { workspace = true }
shellwords = { workspace = true }
tracing-subscriber = { workspace = true }
indoc = { workspace = true }
tokio = { workspace = true }
zip32 = { workspace = true }
zcash_client_backend = { workspace = true }
zcash_primitives = { workspace = true }
zcash_address = { workspace = true }
zcash_keys = { workspace = true }
tempfile = { workspace = true, optional = true }
