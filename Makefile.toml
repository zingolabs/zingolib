[config]
default_to_workspace = false

[tasks.default]
alias = "help"

[tasks.help]
description = "List Zingolib cargo-make tasks"
script_runner = "bash"
script = '''
set -euo pipefail

cat <<'HELP'
Zingolib test tasks
-------------------

Test front door — `makers test "$@"` is a containerized
`cargo nextest run "$@"`, so every nextest idiom passes through:
  makers test                 the whole workspace
  makers test -p zingo-memo   one package
  makers test some_test_name  positional test-name filter
  makers test --no-fail-fast  any nextest flag

Reserved first words expand to canned invocations:
  makers test packages        every workspace package EXCEPT the live
                              ones (libtonode-tests and zingo-cli)
  makers test live            ONLY libtonode-tests and zingo-cli

Explicit package-selection flags (-p, --workspace, --exclude, ...) replace
a reserved word's scope entirely. Extra args after a reserved word are
forwarded to nextest:
  makers test live --no-fail-fast

Run the three gated phases (packages, zingo-cli, libtonode), where a
failing phase stops the later, more expensive ones, with a combined
per-phase summary:
  makers hierarchy-test

Run the same three phases with the libtonode one narrowed to the
chain_generics::send_shield_cycle fixture, which is the cheapest run
that still exercises the chain-level machinery. That phase also builds
only the one test binary of libtonode-tests' ten, via a cargo target
selection that leaves the shared --workspace scope intact:
  makers lite-hierarchy

Common usage:
  makers container-test
  cargo make container-test

The container-test task runs tests inside a reproducible container image:
  cargo nextest run --workspace --profile ci --retries 0

Build or refresh the local image:
  makers build-image

Run the same nextest command on the host:
  makers local-run

The local-run task mirrors the PR test defaults:
  cargo nextest run --workspace --profile ci --retries 0

Forward extra nextest flags after the task name:
  makers container-test -p zingo-memo

Filter with a nextest expression:
  makers test -E 'package(zingolib) & not test(slow)'

Reproduce the latest failing or incomplete nextest run:
  makers rerun

Run ignored tests explicitly:
  makers run-ignored

Launch the wallet CLI with the mixnet transport compiled in and
nym-proxy bundled beside the binary. The CLI itself boots the proxy
only at an Online session's start (Mixnet Mode forced on, ADR 0024);
an offline session boots no proxy, and the session is offline unless a
Connectivity Consent stored by a previous run takes it online
(ADR 0025). Other args are forwarded to zingo-cli:
  makers run-cli

Opt out of the mixnet default — plain build, nothing bundled:
  makers run-cli --nakednet

Install cargo-make if these commands are unavailable:
  cargo install cargo-make
HELP
'''

[tasks.compute-image-tag]
description = "Print the reproducible local test image tag"
command = "cargo"
args = ["xtask", "ci-plan", "image-tag"]

[tasks.build-image]
description = "Build the reproducible local test image from .env.testing-artifacts"
command = "cargo"
args = ["xtask", "image", "build"]

[tasks.ensure-image-exists]
description = "Build the reproducible test image if it is not present locally"
command = "cargo"
args = ["xtask", "image", "ensure"]

[tasks.local-run]
clear = true
description = "Run reproducible workspace tests on the host with the same defaults used by PR CI"
command = "cargo"
args = ["xtask", "local-run", "${@}"]

[tasks.container-test]
clear = true
description = "Run reproducible workspace tests inside the local test container"
command = "cargo"
args = ["xtask", "test", "${@}"]

# The test front door is `cargo xtask test`; this task keeps the makers
# spelling until Makefile.toml goes.
[tasks.test]
clear = true
description = "Containerized `cargo nextest run \"$@\"`. Reserved first words packages|live expand to canned invocations."
command = "cargo"
args = ["xtask", "test", "${@}"]

[tasks.hierarchy-test]
description = "Run the three gated phases (packages, zingo-cli, libtonode): a failing phase stops the later, more expensive ones; prints a combined per-phase summary"
command = "cargo"
args = [
  "run",
  "-q",
  "--manifest-path",
  "tools/workbench/Cargo.toml",
  "--bin",
  "test-summary",
  "--",
  "${@}",
]

[tasks.lite-hierarchy]
description = "Run the same three gated phases as hierarchy-test, with the libtonode phase narrowed to chain_generics::send_shield_cycle and built as that one test binary rather than all ten: the cheapest run that still proves the chain-level machinery, for gating between commits rather than before a push"
command = "cargo"
args = [
  "run",
  "-q",
  "--manifest-path",
  "tools/workbench/Cargo.toml",
  "--bin",
  "test-summary",
  "--",
  "--lite",
  "${@}",
]

[tasks.exclusion-audit]
description = "Check that every member in Makefile.toml's build_excludable array can be dropped from the packages phase's build for free, by diffing each workspace crate's resolved features with and without it. Name extra candidates as arguments to audit a proposed addition before writing it down."
command = "cargo"
args = [
  "run",
  "-q",
  "--manifest-path",
  "tools/workbench/Cargo.toml",
  "--bin",
  "exclusion-audit",
  "--",
  "${@}",
]

[tasks.feature-sweep]
description = "Check the crates this branch touches in every feature combination, the way CI's Cargo Hack Check job does, so code that only a non-default feature compiles (a `#[cfg(not(feature = \"nym\"))]` module, say) fails here rather than after the push. Pass --all for the whole workspace, --base <ref> to compare against another branch, or crate directories to check those and no others."
command = "cargo"
args = [
  "run",
  "-q",
  "--manifest-path",
  "tools/workbench/Cargo.toml",
  "--bin",
  "feature-sweep",
  "--",
  "${@}",
]

[tasks.bundle-nym-proxy]
description = "Build the standalone nym-proxy binary (from the zingo-netutils workspace, own lockfile) and copy it beside the target/<profile>/ wallet binaries so the CLI finds it with no configuration (ADR 0011). Pass --release for a release build, or --dest <dir> for another location."
command = "cargo"
args = [
  "run",
  "-q",
  "--manifest-path",
  "tools/workbench/Cargo.toml",
  "--bin",
  "bundle-nym-proxy",
  "--",
  "${@}",
]

[tasks.run-cli]
description = "Build and launch zingo-cli with the mixnet transport compiled in and nym-proxy bundled beside the binary. The proxy is never launched here: the CLI spawns it only at an Online session's go-online moment (ADR 0024), and an offline session boots no proxy. The session starts offline and goes online only through a Connectivity Consent — one stored by a previous run, or an explicit consent act in the forwarded arguments (ADR 0025); launching never implies consent. Pass --nakednet to opt out of the mixnet default (plain build, nothing bundled); the build is a release build unless --debug asks otherwise. Pass --features <list> to name extra cargo features, which reach the build and not the CLI, and --build-only to stop after the build and the bundling without launching a session. Every other argument is forwarded to zingo-cli."
command = "cargo"
args = [
  "run",
  "-q",
  "--manifest-path",
  "tools/workbench/Cargo.toml",
  "--bin",
  "run-cli",
  "--",
  "${@}",
]

[tasks.sync-bench]
description = "Time sync inside a real run-cli --online session, so the mixnet boot load is present. Drives the CLI, starts the clock at the sync launch, and stops it when the prompt reports the wallet synced. Requires --birthday <height>; both arms of an A/B must pass the same one so they scan the same window. Builds the release CLI once before the runs, so no session's clock carries a compile and no core-second is an unoptimized one. Reports the wallet's and the proxy's core-seconds over the boot and over the span beside the times. Takes --nakednet to run the nakednet arm alone, --compare to alternate both arms round by round so machine load falls on each equally, --label <text> to stamp the arm, and --runs <n> for the sessions per arm. Each arm builds into its own directory under target/sync-bench/builds, so alternating costs no rebuild but two release builds sit on disk."
command = "cargo"
args = [
  "run",
  "-q",
  "--manifest-path",
  "tools/workbench/Cargo.toml",
  "--bin",
  "sync-bench",
  "--",
  "${@}",
]

[tasks.sync-ab]
description = "Compare two commits' sync rate inside a real run-cli --online session, so the mixnet boot load is present, interleaved, with everything but the commits held fixed: the same indexer, seed, window, performance level, and release profile. Usage: makers sync-ab [cli] <commit> <commit> --birthday <height>. The reserved first word names the session kind, as makers test's packages and live name their scopes, and omitting it names the same kind. Both arms receive the one birthday. Gives each commit its own worktree, discards a warm-up run per arm, then alternates the arms so warm-up and machine load fall on both equally, and reports outputs per second with the arms' spread. Takes --runs <n> for the measured sessions per arm, --seconds <n> to stop each scan that long after it starts rather than running it to completion, --seed <mnemonic> to restore a wallet other than the fundless default, and --nakednet to run the same comparison with the mixnet out of the picture, which is how a difference is attributed to it."
command = "cargo"
args = [
    "run",
    "-q",
    "--manifest-path",
    "tools/workbench/Cargo.toml",
    "--bin",
    "sync-ab",
    "--",
    "${@}",
]

[tasks.rerun]
clear = true
description = "Rerun tests that failed or did not complete in the latest recorded nextest run"
command = "cargo"
args = ["xtask", "rerun", "${@}"]

[tasks.run-ignored]
clear = true
description = "Run ignored tests with the reproducible nextest profile"
command = "cargo"
args = ["xtask", "run-ignored", "${@}"]

[tasks.test-extra-credit]
description = "Containerized run of libtonode's extra-credit suite (sentinels + unit_test_twins twins)"
command = "cargo"
args = ["xtask", "test-extra-credit", "${@}"]
