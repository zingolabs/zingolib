env_files = [".env.testing-artifacts"]

[config]
default_to_workspace = false

[env]
NEXTEST_EXPERIMENTAL_LIBTEST_JSON = "1"
ZINGOLIB_NEXTEST_PROFILE = "ci"
# Conditional for the same reason as ZINGOLIB_NEXTEST_FILTER below: lets a
# shell override win. Retries default to 0 so flakes surface instead of
# being masked; raise per-run with ZINGOLIB_NEXTEST_RETRIES=N.
ZINGOLIB_NEXTEST_RETRIES = { value = "0", condition = { env_not_set = [
    "ZINGOLIB_NEXTEST_RETRIES",
] } }
# Conditional so a shell override (documented in `makers help`, and used by
# `makers test all` to clear the filter) actually wins: cargo-make [env]
# entries otherwise clobber inherited environment variables.
ZINGOLIB_NEXTEST_FILTER = { value = "not test(slow)", condition = { env_not_set = [
    "ZINGOLIB_NEXTEST_FILTER",
] } }
IMAGE_NAME = "zingodevops/ci-build"
# Single source of truth: rust-toolchain.toml's `channel`, extracted and
# validated (concrete numeric versions only) by the workbench
# `get-rust-version` binary.
RUST_VERSION = { script = ["cargo run -q --manifest-path tools/workbench/Cargo.toml --bin get-rust-version"] }

[tasks.default]
alias = "help"

[tasks.help]
description = "List Zingolib cargo-make tasks"
script_runner = "bash"
script = '''
set -euo pipefail

cat <<'HELP'
Zingolib test tasks
-------------------

Test sets (front door):
  makers test                 packages (the default): every workspace package
                              EXCEPT libtonode-tests and zingo-cli
  makers test packages        same as the default
  makers test live            ONLY libtonode-tests and zingo-cli
  makers test libtonode       exactly the libtonode-tests package
  makers test zingo-cli       exactly the zingo-cli package
  makers test all             every test in the repo, in three gated
                              phases: packages, then zingo-cli, then
                              libtonode, INCLUDING the slow:: tests the
                              default filter excludes (ignored tests still
                              need run-ignored). A phase failure stops the
                              later phases from launching; a combined
                              per-phase summary table prints at the end

Every set runs inside the reproducible CI container and forwards extra
nextest args:
  makers test live --no-fail-fast

Common usage:
  makers container-test
  cargo make container-test

The container-test task runs tests inside a reproducible container image:
  cargo nextest run --verbose --workspace --profile ci --retries 0 -E 'not test(slow)'

Build or refresh the local image:
  makers build-image

Run the same nextest command on the host:
  makers local-run

The local-run task mirrors the PR test defaults:
  cargo nextest run --verbose --workspace --profile ci --retries 0 -E 'not test(slow)'

Forward extra nextest flags after the task name:
  makers container-test -p zingo-memo

Override the default nextest filter:
  ZINGOLIB_NEXTEST_FILTER='package(zingolib) & not test(slow)' makers container-test

Reproduce the latest failing or incomplete nextest run:
  makers rerun

Run ignored tests explicitly:
  makers run-ignored

Install cargo-make if these commands are unavailable:
  cargo install cargo-make
HELP
'''

[tasks.base-script]
script_runner = "bash"
script.pre = '''
set -euo pipefail

container_runtime() {
  if [[ -n "${CONTAINER_RUNTIME:-}" ]]; then
    printf '%s\n' "${CONTAINER_RUNTIME}"
  elif command -v podman >/dev/null 2>&1; then
    printf '%s\n' "podman"
  elif command -v docker >/dev/null 2>&1; then
    printf '%s\n' "docker"
  else
    echo "Neither podman nor docker was found. Install one or set CONTAINER_RUNTIME." >&2
    exit 1
  fi
}

container_mount_suffix() {
  case "$(container_runtime)" in
    podman) printf '%s\n' ":U" ;;
    *) printf '%s\n' "" ;;
  esac
}

container_dir_hash() {
  {
    for path in .env.testing-artifacts rust-toolchain.toml; do
      printf '%s %s\n' "${path}" "$(git hash-object "${path}")"
    done
    find docker-ci -type f | LC_ALL=C sort | while IFS= read -r path; do
      printf '%s %s\n' "${path}" "$(git hash-object "${path}")"
    done
  } | git hash-object --stdin | cut -c1-14
}

container_image_tag() {
  printf 'RUST_%s-LIGHTWALLETD_%s-ZAINO_%s-ZEBRA_%s-NEXTEST_%s-CONTAINER_%s' \
    "${RUST_VERSION}" \
    "${LIGHTWALLETD_VERSION}" \
    "${ZAINO_IMAGE_TAG}" \
    "${ZEBRA_VERSION}" \
    "${NEXTEST_VERSION}" \
    "$(container_dir_hash)" \
    | git hash-object --stdin \
    | cut -c1-14
}

append_workspace_default() {
  local use_default_workspace=1
  for arg in "$@"; do
    case "${arg}" in
      -p|--package|--package=*|--workspace|--all|--exclude|--exclude=*|--manifest-path|--manifest-path=*)
        use_default_workspace=0
        ;;
    esac
  done

  if [[ "${use_default_workspace}" -eq 1 ]]; then
    printf '%s\n' "--workspace"
  fi
}

nextest_args() {
  local -a extra_args=("$@")
  local -a args=(
    --verbose
    --profile "${ZINGOLIB_NEXTEST_PROFILE}"
    --retries "${ZINGOLIB_NEXTEST_RETRIES}"
  )

  args+=("${extra_args[@]}")

  local workspace_arg
  workspace_arg="$(append_workspace_default "$@")"
  if [[ -n "${workspace_arg}" ]]; then
    args+=("${workspace_arg}")
  fi

  if [[ -n "${ZINGOLIB_NEXTEST_FILTER:-}" ]]; then
    args+=(-E "${ZINGOLIB_NEXTEST_FILTER}")
  fi

  printf '%s\n' "${args[@]}"
}

container_nextest_run() {
  local runtime mount_suffix tag
  runtime="$(container_runtime)"
  mount_suffix="$(container_mount_suffix)"
  tag="$(container_image_tag)"

  local -a args
  mapfile -t args < <(nextest_args "$@")

  "${runtime}" run --rm --init \
    --pids-limit -1 \
    -v "${PWD}:/workspace" \
    -v "zingolib-container-target:/workspace/target${mount_suffix}" \
    -v "zingolib-cargo-git:/root/.cargo/git${mount_suffix}" \
    -v "zingolib-cargo-registry:/root/.cargo/registry${mount_suffix}" \
    -e "NEXTEST_EXPERIMENTAL_LIBTEST_JSON=${NEXTEST_EXPERIMENTAL_LIBTEST_JSON}" \
    -e "TEST_BINARIES_DIR=/workspace/test_binaries/bins" \
    -w /workspace \
    "${IMAGE_NAME}:${tag}" \
    bash -lc 'mkdir -p test_binaries/bins && ln -sf /usr/bin/lightwalletd /usr/bin/zainod /usr/bin/zebrad test_binaries/bins/ && exec "$@"' \
    bash \
    cargo nextest run "${args[@]}"
}
'''
script.main = "true"

[tasks.prepare-test-binaries-dir]
description = "Ensure the local test binary directory exists"
script_runner = "bash"
script = '''
set -euo pipefail
mkdir -p test_binaries/bins
'''

[tasks.compute-image-tag]
description = "Print the reproducible local test image tag"
extend = "base-script"
script.main = '''
echo "$(container_image_tag)"
'''

[tasks.init-container-volumes]
description = "Initialize named volumes used by containerized tests"
extend = "base-script"
script.main = '''
runtime="$(container_runtime)"
for volume in zingolib-container-target zingolib-cargo-git zingolib-cargo-registry; do
  "${runtime}" volume inspect "${volume}" >/dev/null 2>&1 || "${runtime}" volume create "${volume}" >/dev/null
done
mkdir -p target test_binaries/bins
'''

[tasks.build-image]
description = "Build the reproducible local test image from .env.testing-artifacts"
extend = "base-script"
dependencies = ["init-container-volumes"]
script.main = '''
runtime="$(container_runtime)"
tag="$(container_image_tag)"

echo "Building ${IMAGE_NAME}:${tag}"
echo "  RUST_VERSION=${RUST_VERSION}"
echo "  LIGHTWALLETD_VERSION=${LIGHTWALLETD_VERSION}"
echo "  ZAINO_IMAGE_TAG=${ZAINO_IMAGE_TAG}"
echo "  ZEBRA_VERSION=${ZEBRA_VERSION}"
echo "  NEXTEST_VERSION=${NEXTEST_VERSION}"

"${runtime}" build \
  -f docker-ci/Dockerfile \
  --build-arg "RUST_VERSION=${RUST_VERSION}" \
  --build-arg "LIGHTWALLETD_VERSION=${LIGHTWALLETD_VERSION}" \
  --build-arg "ZAINO_IMAGE_TAG=${ZAINO_IMAGE_TAG}" \
  --build-arg "ZEBRA_VERSION=${ZEBRA_VERSION}" \
  --build-arg "NEXTEST_VERSION=${NEXTEST_VERSION}" \
  -t "${IMAGE_NAME}:${tag}" \
  docker-ci
'''

[tasks.ensure-image-exists]
description = "Build the reproducible test image if it is not present locally"
extend = "base-script"
dependencies = ["init-container-volumes"]
script.main = '''
runtime="$(container_runtime)"
tag="$(container_image_tag)"

echo "Checking for ${IMAGE_NAME}:${tag} with ${runtime}..."

if "${runtime}" image inspect "${IMAGE_NAME}:${tag}" >/dev/null 2>&1; then
  echo "Image ${IMAGE_NAME}:${tag} already exists."
else
  echo "Image ${IMAGE_NAME}:${tag} not found; building it now."
  export CONTAINER_RUNTIME="${runtime}"
  makers build-image
fi
'''

[tasks.local-run]
clear = true
description = "Run reproducible workspace tests on the host with the same defaults used by PR CI"
dependencies = ["prepare-test-binaries-dir"]
script_runner = "bash"
extend = "base-script"
script.main = '''
mapfile -t args < <(nextest_args "$@")
cargo nextest run "${args[@]}"
'''

[tasks.container-test]
clear = true
description = "Run reproducible workspace tests inside the local test container"
dependencies = ["ensure-image-exists"]
script_runner = "bash"
extend = "base-script"
script.main = '''
container_nextest_run "$@"
'''

# ===================================================================
# Developer-facing test front door: a single `makers test [SET]` task.
#
#   makers test                packages (the default)
#   makers test packages       every workspace package EXCEPT the live ones
#   makers test live           ONLY the live packages
#   makers test libtonode      exactly the libtonode-tests package
#   makers test zingo-cli      exactly the zingo-cli package
#   makers test all            three gated phases + combined summary (workbench test-summary)
#
# The live-package list is defined once (live_packages, below); `packages`
# derives its exclusions from it and `live` derives its selections from it,
# so the partition cannot drift. Every set delegates to the container-test
# engine rather than re-implementing a run — set-name validation therefore
# happens before ensure-image-exists can trigger an image build — and extra
# args after the set name are forwarded to `cargo nextest run`.
# ===================================================================

[tasks.test]
# clear = true fully replaces cargo-make's built-in `test` task (which runs
# `cargo test`); without it our `script` would merge with the builtin `command`.
clear = true
description = "Run a test set: `makers test [packages|live|libtonode|zingo-cli|all]` (default: packages). Extra args are forwarded to nextest."
script_runner = "bash"
script = '''
set -uo pipefail

# The packages that need live network infrastructure. Single source of truth
# for the packages/live partition.
live_packages=(libtonode-tests zingo-cli)

usage() {
  echo "usage: makers test [packages|live|libtonode|zingo-cli|all] [nextest args]" >&2
  echo "  packages (default)  every workspace package EXCEPT: ${live_packages[*]}" >&2
  echo "  live                ONLY the live packages: ${live_packages[*]}" >&2
  echo "  libtonode           exactly the libtonode-tests package" >&2
  echo "  zingo-cli           exactly the zingo-cli package" >&2
  echo "  all                 three gated phases + combined summary: packages, zingo-cli, libtonode (slow:: included)" >&2
}

# A non-flag first arg selects the set and must be a known name; a flag first
# arg (or none) keeps the default `packages` and is forwarded to nextest. So
# `makers test --no-fail-fast` runs packages with the flag, while a mistyped
# set name errors instead of silently running the default.
test_set="packages"
if [[ "$#" -gt 0 && "${1#-}" == "$1" ]]; then
  case "$1" in
    packages|live|libtonode|zingo-cli|all) test_set="$1"; shift ;;
    *) echo "makers test: unknown set '$1'" >&2; usage; exit 2 ;;
  esac
fi

pkg_args=()
case "${test_set}" in
  packages)
    pkg_args+=(--workspace)
    for pkg in "${live_packages[@]}"; do pkg_args+=(--exclude "${pkg}"); done ;;
  live)
    for pkg in "${live_packages[@]}"; do pkg_args+=(--package "${pkg}"); done ;;
  libtonode)
    pkg_args+=(--package libtonode-tests) ;;
  zingo-cli)
    pkg_args+=(--package zingo-cli) ;;
  all)
    # Delegate to the workbench summary runner (zaino's live-summary
    # pattern, with gating): it runs the packages, zingo-cli, and
    # libtonode phases in order, stops launching later phases when one
    # fails (a broken unit test never costs a libtonode run), prints a
    # combined per-phase summary table, and exits non-zero on failure.
    # The runner clears the default `not test(slow)` filter itself, so
    # the slow:: tests are included. #[ignore]d tests are still skipped
    # by design: `makers run-ignored`.
    exec cargo run -q --manifest-path tools/workbench/Cargo.toml --bin test-summary -- "$@" ;;
esac

exec makers container-test "${pkg_args[@]}" "$@"
'''

[tasks.rerun]
clear = true
description = "Rerun tests that failed or did not complete in the latest recorded nextest run"
dependencies = ["ensure-image-exists"]
script_runner = "bash"
extend = "base-script"
script.main = '''
container_nextest_run --rerun latest "$@"
'''

[tasks.run-ignored]
clear = true
description = "Run ignored tests with the reproducible nextest profile"
dependencies = ["prepare-test-binaries-dir"]
script_runner = "bash"
extend = "base-script"
script.main = '''
mapfile -t args < <(nextest_args --run-ignored all "$@")
cargo nextest run "${args[@]}"
'''
