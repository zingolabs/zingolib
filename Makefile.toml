env_files = [".env.testing-artifacts"]

[config]
default_to_workspace = false

[env]
NEXTEST_EXPERIMENTAL_LIBTEST_JSON = "1"
ZINGOLIB_NEXTEST_PROFILE = "ci"
# Conditional so a shell override actually wins: cargo-make [env] entries
# otherwise clobber inherited environment variables. Retries default to 0 so
# flakes surface instead of being masked; raise per-run with
# ZINGOLIB_NEXTEST_RETRIES=N.
ZINGOLIB_NEXTEST_RETRIES = { value = "0", condition = { env_not_set = [
    "ZINGOLIB_NEXTEST_RETRIES",
] } }
IMAGE_NAME = "zingodevops/ci-build"
# Single source of truth: rust-toolchain.toml's `channel`, extracted and
# validated (concrete numeric versions only) by the workbench
# `get-rust-version` binary.
RUST_VERSION = { script = ["cargo run -q --manifest-path tools/workbench/Cargo.toml --bin get-rust-version"] }

[tasks.default]
alias = "help"

[tasks.help]
description = "List Zingolib cargo-make tasks"
script_runner = "bash"
script = '''
set -euo pipefail

cat <<'HELP'
Zingolib test tasks
-------------------

Test front door — `makers test "$@"` is a containerized
`cargo nextest run "$@"`, so every nextest idiom passes through:
  makers test                 the whole workspace
  makers test -p zingo-memo   one package
  makers test some_test_name  positional test-name filter
  makers test --no-fail-fast  any nextest flag

Reserved first words expand to canned invocations:
  makers test packages        every workspace package EXCEPT the live
                              ones (libtonode-tests and zingo-cli)
  makers test live            ONLY libtonode-tests and zingo-cli

Explicit package-selection flags (-p, --workspace, --exclude, ...) replace
a reserved word's scope entirely. Extra args after a reserved word are
forwarded to nextest:
  makers test live --no-fail-fast

Run the three gated phases (packages, zingo-cli, libtonode), where a
failing phase stops the later, more expensive ones, with a combined
per-phase summary:
  makers hierarchy-test

Common usage:
  makers container-test
  cargo make container-test

The container-test task runs tests inside a reproducible container image:
  cargo nextest run --workspace --profile ci --retries 0

Build or refresh the local image:
  makers build-image

Run the same nextest command on the host:
  makers local-run

The local-run task mirrors the PR test defaults:
  cargo nextest run --workspace --profile ci --retries 0

Forward extra nextest flags after the task name:
  makers container-test -p zingo-memo

Filter with a nextest expression:
  makers test -E 'package(zingolib) & not test(slow)'

Reproduce the latest failing or incomplete nextest run:
  makers rerun

Run ignored tests explicitly:
  makers run-ignored

Install cargo-make if these commands are unavailable:
  cargo install cargo-make
HELP
'''

[tasks.base-script]
script_runner = "bash"
script.pre = '''
set -euo pipefail

container_runtime() {
  if [[ -n "${CONTAINER_RUNTIME:-}" ]]; then
    printf '%s\n' "${CONTAINER_RUNTIME}"
  elif command -v podman >/dev/null 2>&1; then
    printf '%s\n' "podman"
  elif command -v docker >/dev/null 2>&1; then
    printf '%s\n' "docker"
  else
    echo "Neither podman nor docker was found. Install one or set CONTAINER_RUNTIME." >&2
    exit 1
  fi
}

container_mount_suffix() {
  case "$(container_runtime)" in
    podman) printf '%s\n' ":U" ;;
    *) printf '%s\n' "" ;;
  esac
}

container_dir_hash() {
  {
    for path in .env.testing-artifacts rust-toolchain.toml; do
      printf '%s %s\n' "${path}" "$(git hash-object "${path}")"
    done
    find docker-ci -type f | LC_ALL=C sort | while IFS= read -r path; do
      printf '%s %s\n' "${path}" "$(git hash-object "${path}")"
    done
  } | git hash-object --stdin | cut -c1-14
}

container_image_tag() {
  printf 'RUST_%s-ZAINO_%s-ZEBRA_%s-NEXTEST_%s-CONTAINER_%s' \
    "${RUST_VERSION}" \
    "${ZAINO_IMAGE_TAG}" \
    "${ZEBRA_VERSION}" \
    "${NEXTEST_VERSION}" \
    "$(container_dir_hash)" \
    | git hash-object --stdin \
    | cut -c1-14
}

has_package_selection_args() {
  for arg in "$@"; do
    case "${arg}" in
      -p|--package|--package=*|--workspace|--all|--exclude|--exclude=*|--manifest-path|--manifest-path=*)
        return 0
        ;;
    esac
  done
  return 1
}

append_workspace_default() {
  if ! has_package_selection_args "$@"; then
    printf '%s\n' "--workspace"
  fi
}

# True when this nextest invocation will run libtonode-tests — the
# chain-cache-bound package — explicitly, or through the workspace
# default. An exclusion wins over a workspace selection.
selects_libtonode_tests() {
  local expect="" selected_other="" workspace=""
  for arg in "$@"; do
    case "${expect}" in
      package)
        expect=""
        if [[ "${arg}" == "libtonode-tests" ]]; then return 0; fi
        selected_other="yes"
        continue
        ;;
      exclude)
        expect=""
        if [[ "${arg}" == "libtonode-tests" ]]; then return 1; fi
        continue
        ;;
    esac
    case "${arg}" in
      -p|--package) expect="package" ;;
      --package=libtonode-tests) return 0 ;;
      --package=*) selected_other="yes" ;;
      --exclude) expect="exclude" ;;
      --exclude=libtonode-tests) return 1 ;;
      --workspace|--all) workspace="yes" ;;
    esac
  done
  # No exclusion matched: the workspace includes libtonode; an explicit
  # other-package selection omits it; no selection at all defaults to
  # the whole workspace (append_workspace_default).
  [[ -n "${workspace}" || -z "${selected_other}" ]]
}

has_test_threads_arg() {
  for arg in "$@"; do
    case "${arg}" in
      -j*|--test-threads|--test-threads=*) return 0 ;;
    esac
  done
  return 1
}

# Host-side probe of the chain-cache fleet (the caches are bind-mounted,
# so host and container see the same files). Prints the count of caches
# whose manifest matches the current fleet key; prints nothing when the
# probe fails, so the caller can fail open.
fresh_chain_cache_count() {
  cargo run -q --package zingolib_testutils --bin chain-cache-fleet 2>/dev/null \
    | sed -n 's/^fresh=\([0-9][0-9]*\) .*/\1/p'
}

nextest_args() {
  local -a extra_args=("$@")
  local -a args=(
    --profile "${ZINGOLIB_NEXTEST_PROFILE}"
    --retries "${ZINGOLIB_NEXTEST_RETRIES}"
  )

  args+=("${extra_args[@]}")

  local workspace_arg
  workspace_arg="$(append_workspace_default "$@")"
  if [[ -n "${workspace_arg}" ]]; then
    args+=("${workspace_arg}")
  fi

  # Cold-fleet guard: fewer than five fresh caches means more than four
  # chain-bound tests are about to (re)build their chains, and unbounded
  # parallelism pushes every build past its per-test timeout ceiling
  # (the 2026-07-17 stampede). Cap at four threads unless the caller
  # picked a thread count. Warm fleets run uncapped.
  if selects_libtonode_tests "$@" && ! has_test_threads_arg "$@"; then
    local fresh
    fresh="$(fresh_chain_cache_count)"
    if [[ -z "${fresh}" ]]; then
      echo "chain-cache fleet probe failed; running without a thread cap" >&2
    elif [[ "${fresh}" -lt 5 ]]; then
      echo "chain-cache fleet: ${fresh} caches current — bulk (re)build ahead, capping at --test-threads 4" >&2
      args+=(--test-threads 4)
    fi
  fi

  printf '%s\n' "${args[@]}"
}

container_nextest_run() {
  local runtime mount_suffix tag
  runtime="$(container_runtime)"
  mount_suffix="$(container_mount_suffix)"
  tag="$(container_image_tag)"

  local -a args
  mapfile -t args < <(nextest_args "$@")

  "${runtime}" run --rm --init \
    --pids-limit -1 \
    -v "${PWD}:/workspace" \
    -v "zingolib-container-target:/workspace/target${mount_suffix}" \
    -v "zingolib-cargo-git:/root/.cargo/git${mount_suffix}" \
    -v "zingolib-cargo-registry:/root/.cargo/registry${mount_suffix}" \
    -e "NEXTEST_EXPERIMENTAL_LIBTEST_JSON=${NEXTEST_EXPERIMENTAL_LIBTEST_JSON}" \
    -e "TEST_BINARIES_DIR=/workspace/test_binaries/bins" \
    -e "ZINGO_REGENERATE_CHAIN_CACHE=${ZINGO_REGENERATE_CHAIN_CACHE:-}" \
    -e "RUST_LOG=${RUST_LOG:-}" \
    -w /workspace \
    "${IMAGE_NAME}:${tag}" \
    bash -lc 'mkdir -p test_binaries/bins && ln -sf /usr/bin/zainod /usr/bin/zebrad test_binaries/bins/ && exec "$@"' \
    bash \
    cargo nextest run "${args[@]}"
}
'''
script.main = "true"

[tasks.prepare-test-binaries-dir]
description = "Ensure the local test binary directory exists"
script_runner = "bash"
script = '''
set -euo pipefail
mkdir -p test_binaries/bins
'''

[tasks.compute-image-tag]
description = "Print the reproducible local test image tag"
extend = "base-script"
script.main = '''
echo "$(container_image_tag)"
'''

[tasks.init-container-volumes]
description = "Initialize named volumes used by containerized tests"
extend = "base-script"
script.main = '''
runtime="$(container_runtime)"
for volume in zingolib-container-target zingolib-cargo-git zingolib-cargo-registry; do
  "${runtime}" volume inspect "${volume}" >/dev/null 2>&1 || "${runtime}" volume create "${volume}" >/dev/null
done
mkdir -p target test_binaries/bins
'''

[tasks.build-image]
description = "Build the reproducible local test image from .env.testing-artifacts"
extend = "base-script"
dependencies = ["init-container-volumes"]
script.main = '''
runtime="$(container_runtime)"
tag="$(container_image_tag)"

echo "Building ${IMAGE_NAME}:${tag}"
echo "  RUST_VERSION=${RUST_VERSION}"
echo "  ZAINO_IMAGE_TAG=${ZAINO_IMAGE_TAG}"
echo "  ZEBRA_VERSION=${ZEBRA_VERSION}"
echo "  NEXTEST_VERSION=${NEXTEST_VERSION}"

"${runtime}" build \
  -f docker-ci/Dockerfile \
  --build-arg "RUST_VERSION=${RUST_VERSION}" \
  --build-arg "ZAINO_IMAGE_TAG=${ZAINO_IMAGE_TAG}" \
  --build-arg "ZAINO_IMAGE_DIGEST=${ZAINO_IMAGE_DIGEST}" \
  --build-arg "ZEBRA_VERSION=${ZEBRA_VERSION}" \
  --build-arg "ZEBRA_IMAGE_DIGEST=${ZEBRA_IMAGE_DIGEST}" \
  --build-arg "NEXTEST_VERSION=${NEXTEST_VERSION}" \
  -t "${IMAGE_NAME}:${tag}" \
  docker-ci
'''

[tasks.ensure-image-exists]
description = "Build the reproducible test image if it is not present locally"
extend = "base-script"
dependencies = ["init-container-volumes"]
script.main = '''
runtime="$(container_runtime)"
tag="$(container_image_tag)"

echo "Checking for ${IMAGE_NAME}:${tag} with ${runtime}..."

if "${runtime}" image inspect "${IMAGE_NAME}:${tag}" >/dev/null 2>&1; then
  echo "Image ${IMAGE_NAME}:${tag} already exists."
else
  echo "Image ${IMAGE_NAME}:${tag} not found; building it now."
  export CONTAINER_RUNTIME="${runtime}"
  makers build-image
fi
'''

[tasks.local-run]
clear = true
description = "Run reproducible workspace tests on the host with the same defaults used by PR CI"
dependencies = ["prepare-test-binaries-dir"]
script_runner = "bash"
extend = "base-script"
script.main = '''
mapfile -t args < <(nextest_args "$@")
cargo nextest run "${args[@]}"
'''

[tasks.container-test]
clear = true
description = "Run reproducible workspace tests inside the local test container"
dependencies = ["ensure-image-exists"]
script_runner = "bash"
extend = "base-script"
script.main = '''
container_nextest_run "$@"
'''

[tasks.regenerate-caches]
clear = true
description = "Rebuild stale chain caches: chain-bound tests under the regen profile's build-sized timeout (ADR 0003 cold-fleet pass)"
dependencies = ["ensure-image-exists"]
script_runner = "bash"
extend = "base-script"
script.main = '''
# A fleet-key bump invalidates every chain cache at once, and the default
# profiles' timeout ceilings are sized for cache replay, not for dozens
# of live chain builds; the regen profile (.config/nextest.toml) runs
# four tests at a time under a ceiling sized for builds. Only the
# chain-bound package participates. Tests whose caches are already
# current replay and pass through quickly, so re-running this task
# converges on a fully cached fleet. Ordinary runs are protected by the
# automatic cold-fleet guard in nextest_args; this task exists for the
# operator who wants the rebuild to happen on its own, with a ceiling
# that can never kill a build mid-export.
ZINGOLIB_NEXTEST_PROFILE=regen container_nextest_run --package libtonode-tests "$@"
'''

# ===================================================================
# Developer-facing test front door: `makers test "$@"` IS a containerized
# `cargo nextest run "$@"` (standard profile and retries defaults), so
# every nextest idiom passes through untouched:
#
#   makers test                     the whole workspace
#   makers test -p zingo-memo       one package
#   makers test some_test_name      positional test-name filter
#
# Two reserved first words expand to canned invocations:
#
#   makers test packages       every workspace package EXCEPT the live ones
#   makers test live            ONLY the live packages
#
# The live-package list is defined once (live_packages, below); `packages`
# derives its exclusions from it and `live` derives its selections from it,
# so the partition cannot drift. Explicit package-selection args replace a
# set's scope entirely — cargo silently ignores `-p` when `--workspace` is
# present, so merging them would swallow the user's selection.
# ===================================================================

[tasks.test]
# clear = true fully replaces cargo-make's built-in `test` task (which runs
# `cargo test`); without it our `script` would merge with the builtin `command`.
clear = true
description = "Containerized `cargo nextest run \"$@\"`. Reserved first words packages|live expand to canned invocations."
script_runner = "bash"
extend = "base-script"
script.main = '''
# The packages that need live network infrastructure. Single source of truth
# for the packages/live partition.
live_packages=(libtonode-tests zingo-cli)

set_args=()
if [[ "$#" -gt 0 ]]; then
  case "$1" in
    packages)
      shift
      set_args+=(--workspace)
      for pkg in "${live_packages[@]}"; do set_args+=(--exclude "${pkg}"); done ;;
    live)
      shift
      for pkg in "${live_packages[@]}"; do set_args+=(--package "${pkg}"); done ;;
  esac
fi

# Explicit package-selection args take over the scope completely; merging
# them with a set's args would make cargo silently ignore the user's `-p`.
if [[ "${#set_args[@]}" -gt 0 ]] && has_package_selection_args "$@"; then
  set_args=()
fi

exec makers container-test "${set_args[@]}" "$@"
'''

[tasks.hierarchy-test]
description = "Run the three gated phases (packages, zingo-cli, libtonode): a failing phase stops the later, more expensive ones; prints a combined per-phase summary"
command = "cargo"
args = [
    "run",
    "-q",
    "--manifest-path",
    "tools/workbench/Cargo.toml",
    "--bin",
    "test-summary",
    "--",
    "${@}",
]

[tasks.rerun]
clear = true
description = "Rerun tests that failed or did not complete in the latest recorded nextest run"
dependencies = ["ensure-image-exists"]
script_runner = "bash"
extend = "base-script"
script.main = '''
container_nextest_run --rerun latest "$@"
'''

[tasks.run-ignored]
clear = true
description = "Run ignored tests with the reproducible nextest profile"
dependencies = ["prepare-test-binaries-dir"]
script_runner = "bash"
extend = "base-script"
script.main = '''
mapfile -t args < <(nextest_args --run-ignored all "$@")
cargo nextest run "${args[@]}"
'''

# The extra-credit libtonode suite: the sentinels (environment-contract
# checks) and unit_test_twins (pre-migration live originals of the offline
# unit twins, docs/testing/live-offline-twins.md). Both are off by default
# and behind the `extra-credit-tests` feature; this is their scheduled
# entry point — a containerized nextest run so a cron or CI job can invoke
# one canonical command. Extra nextest args pass through.
[tasks.test-extra-credit]
description = "Containerized run of libtonode's extra-credit suite (sentinels + unit_test_twins twins)"
script_runner = "bash"
extend = "base-script"
script.main = '''
exec makers container-test --package libtonode-tests --features extra-credit-tests "$@"
'''
