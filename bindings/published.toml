# The Publication Record of the Binding Layer: zingolib's own record of the
# Prebuilt Bundles it has published, one entry per Published Commit, oldest
# first. Each entry records what the registry holds for its commit. The
# publish workflow, started by `gh workflow run binding-layer-publish.yaml`,
# pushes the bundles, appends the entry with its digests and its audited
# crates, regenerates bindings/CHANGELOG.md in the same commit on the branch
# record/<commit>, and opens the pull request that merges it. An entry is
# complete when it is written, and no entry is written by hand. The
# manifest check is a required check that reconciles this record against
# the registry. It passes only when the registry holds every named
# platform's Prebuilt Bundle at the entry's digest. The registry is the one
# source a consumer reads, and a consumer never reads this file. An entry
# never changes after its merge. The workbench tool binding-manifest reads
# this file, and binding-changelog takes the commits and the audited crates
# of bindings/CHANGELOG.md from it.
#
# An entry names every platform that binding-manifest requires. The
# required set lives in REQUIRED_PLATFORMS of
# tools/workbench/src/binding_manifest.rs alone, and it names both
# platforms (zingolib#2833, decision 6): a consumer ships both from one
# commit, and an entry never changes after its merge, so an entry that
# lacked one digest could never gain it. The publish workflow asks the
# tool rather than naming a platform itself, and the tool refuses to push
# anything when a required platform's build produced no bundle.
#
# [[entry]]
# commit = "<the full zingolib commit>"
# since = "<the commit the first entry's changelog section starts after; the first entry alone>"
# android = "sha256:<the digest of ghcr.io/zingolabs/zingolib/binding-layer-android:<commit>>"
# ios = "sha256:<the digest of ghcr.io/zingolabs/zingolib/binding-layer-ios:<commit>>"
# audited = ["<package> (<directory>)", ...]
#
# The audited crates are the two Binding Layer crates and their direct
# dependencies in this repository at the entry's commit, as binding-manifest
# reads them from `cargo metadata` there, each as its package name and its
# directory. The manifest check reads them again at the commit and rejects
# an entry whose array differs.

