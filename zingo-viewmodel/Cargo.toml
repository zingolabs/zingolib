[package]
name = "zingo-viewmodel"
description = "Editorial reductions over zingolib's canonical wallet data."
version = "0.1.0"
authors = ["<zingo@zingolabs.org>"]
edition = "2024"
repository = "https://github.com/zingolabs/zingolib"
homepage = "https://github.com/zingolabs/zingolib"
license = "MIT"

[features]
# Presentation of Mixnet Mode (ADR 0011) for consumers of the nym-gated
# zingolib surface.
nym = ["zingolib/nym"]
# Chain-generic fixtures for the editorial layer, for integration-test
# crates that drive them against a LocalNet.
testutils = ["zingolib/testutils", "dep:tracing"]

[dependencies]
chrono = { workspace = true }
json = { workspace = true }
tracing = { workspace = true, optional = true }
zcash_protocol = { workspace = true }
zingo-status = { workspace = true }
zingolib = { workspace = true }

[dev-dependencies]
incrementalmerkletree = { workspace = true }
orchard = { workspace = true }
pepper-sync = { workspace = true, features = ["test-features"] }
tokio = { workspace = true, features = ["full"] }
zcash_client_backend = { workspace = true }
zcash_primitives = { workspace = true }
zingo_common_components = { workspace = true }
zingo_test_vectors = { workspace = true }
zingolib = { workspace = true, features = ["testutils"] }
zip32 = { workspace = true }
