[package]
name = "libtonode-tests"
version = "0.2.0"
edition = "2024"
publish = false

[features]
default = []
# The chain-generic fixtures against the public testnet, through
# zingolib's NetworkedTestEnvironment. Off by default: the tests dial the
# network, spend from one shared testnet wallet, and wait for real blocks.
testnet = ["zingolib/nym"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
zingolib = { workspace = true, features = ["perspective", "testutils"] }
http = { workspace = true }

[dev-dependencies]
incrementalmerkletree.workspace = true
pepper-sync = { workspace = true, features = ["test-features"] }
shardtree.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing-subscriber.workspace = true
zcash_protocol = { workspace = true }
# `testutils` exposes `time::test`, the tests' temporal parameters.
zingo-netutils = { workspace = true, features = ["testutils"] }
zingo_test_vectors = { workspace = true }
zip32 = { workspace = true }
