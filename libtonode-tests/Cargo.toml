[package]
name = "libtonode-tests"
version = "0.2.0"
edition = "2024"
publish = false

[features]
default = ["chain_generic_tests", "proptests"]
# Retained as a pure cfg gate for the pool_matrix module (formerly the
# proptest module); it no longer pulls the proptest crate.
proptests = []
chain_generic_tests = []
ci = ["zingolib/ci"]
# Pre-migration originals of tests that gained offline unit twins
# (docs/testing/live-offline-twins.md). Off by default: the twins carry
# the default coverage; enable to run the live originals side-by-side.
unit_test_twins = []
# Sentinel tests pin environment contracts (zebrad behavior and the
# zcash_local_net launch contract), not this repository's code. Off by
# default: run them when the environment moves — infra pin bumps,
# container-image bumps, activation-height changes.
sentinels = []
# Everything beyond the default suite, in one switch.
extra-credit-tests = ["sentinels", "unit_test_twins"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
zingolib = { workspace = true, features = ["testutils"] }
zingolib_testutils = { path = "../zingolib_testutils" }
zcash_local_net = { workspace = true }
http = { workspace = true }

[dev-dependencies]
test-log.workspace = true
bip0039.workspace = true
incrementalmerkletree.workspace = true
itertools = { workspace = true }
json = { workspace = true }
pepper-sync = { workspace = true }
shardtree.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zcash_address = { workspace = true, features = ["test-dependencies"] }
zcash_client_backend = { workspace = true }
zcash_primitives = { workspace = true }
zcash_protocol = { workspace = true }
zcash_transparent = { workspace = true }
zingo-netutils = { workspace = true }
zingo-status = { workspace = true }
zingo_test_vectors = { workspace = true }
zingo_common_components = { workspace = true }
zip32 = { workspace = true }
