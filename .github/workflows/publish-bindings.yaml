# `gh workflow run publish-bindings.yaml --ref dev` publishes the Binding
# Layer for the head of dev, and `--field commit=<sha>` names another commit
# of dev. The run builds the commit through the two build workflows and
# hands their bundles to the workbench tool binding-publish. The tool pushes
# each Prebuilt Bundle to the registry, appends the complete entry to
# bindings/published.toml, regenerates bindings/CHANGELOG.md, and pushes the
# two files on the branch record/<commit>. The workflow opens the pull
# request that merges the record, and the checks "Binding Layer manifest"
# and "Binding Layer changelog" verify the entry there. Nothing waits on
# that merge: the registry is published, and the record follows.
#
# Files and tool are one commit. A dispatched run takes this file and the
# build workflows from the ref it was dispatched at, and the tool from the
# same checkout. When that ref's head is not the commit, the plan job tags
# the commit publish/<commit>, dispatches this workflow at the tag and
# stops, and the second run builds. PR #2991's publication showed why: the
# head's iOS workflow and an older commit's tool disagreed on a flag, and
# the build failed. The publish job pushes the bundles with the commit's
# tool, which named and shaped them, and then records the entry with the
# default branch's tool, which the record's own checks regenerate with. A
# commit from before this trigger existed cannot be dispatched, and the
# plan refuses it by name.
#
# The record is in order of publication, and each entry's changelog section
# follows the earlier entries that are ancestors of its commit and of no
# other such entry, so the plan refuses a commit none of whose ancestors is
# in the record, and it refuses a publication while another record's pull
# request is pending. A release line candidate, merged into dev after a
# later commit of dev was published, has the candidate it fixes among its
# ancestors and is accepted, and the first commit of dev after the merge
# follows both the candidate and the last entry of dev. A commit the
# registry already holds is not rebuilt, and a
# commit the record names already, or whose record is pending, ends the
# run after the plan.
#
# The record's push and its pull request use an installation token of the
# GitHub App that the secrets BINDING_PUBLISH_APP_ID and
# BINDING_PUBLISH_APP_PRIVATE_KEY name, an App installed on this repository
# with write access to its contents and its pull requests. GitHub starts no
# workflow for a push or a pull request made with GITHUB_TOKEN, so that
# token would leave the record without its checks. The App's token is
# minted in the publish job and lives one hour. The tag and the relay use
# GITHUB_TOKEN: a tag push by that token starts no workflow, which is
# wanted, and workflow_dispatch is the one event the token may start.
name: Publish the Binding Layer

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit of dev to publish. Empty publishes the head of the dispatched ref.
        required: false
        type: string
        default: ""

# The tag push needs contents, the relay needs actions, and the registry
# push needs packages. The record's push and pull request use the App.
permissions:
  contents: write
  actions: write
  packages: write

# One publication at a time, so the plan's view of the pending records
# holds until the record is pushed. A relayed run queues behind the run
# that dispatched it, which ends a moment later.
concurrency:
  group: ${{ github.workflow }}

jobs:
  request:
    name: Plan the publication
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      relay: ${{ steps.plan.outputs.relay }}
      recorded: ${{ steps.plan.outputs.recorded }}
      held: ${{ steps.held.outputs.held }}
      abis: ${{ steps.names.outputs.abis }}
      abi_artifacts: ${{ steps.names.outputs.abi_artifacts }}
      abi_pattern: ${{ steps.names.outputs.abi_pattern }}
      android_repository: ${{ steps.names.outputs.android_repository }}
      maven_version: ${{ steps.names.outputs.maven_version }}
      bundle_android: ${{ steps.names.outputs.bundle_android }}
      bundle_ios: ${{ steps.names.outputs.bundle_ios }}
      bundle_pattern: ${{ steps.names.outputs.bundle_pattern }}
      ios_out: ${{ steps.names.outputs.ios_out }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the publish App
        env:
          APP_ID: ${{ secrets.BINDING_PUBLISH_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BINDING_PUBLISH_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::the secrets BINDING_PUBLISH_APP_ID and BINDING_PUBLISH_APP_PRIVATE_KEY are not both set, and GITHUB_TOKEN cannot start the checks on the record"
            exit 1
          fi

      # The plan resolves the commit against the default branch and reads
      # its record there, so the checkout needs the whole history.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup
        with:
          workspaces: tools/workbench

      # The tool refuses a commit off the default branch, one that descends
      # from no entry, one whose publish workflow has no dispatch trigger, and
      # a publication while another record is pending. It reports whether
      # this run is at the commit, whether the tag exists already, and
      # whether the record names the commit.
      - name: Plan the publication
        id: plan
        env:
          REQUESTED: ${{ inputs.commit || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cargo run --quiet --manifest-path tools/workbench/Cargo.toml \
            --bin binding-publish -- --plan \
            --commit "$REQUESTED" \
            --run-at "$GITHUB_SHA" \
            --default-branch "origin/${DEFAULT_BRANCH}" \
            >> "$GITHUB_OUTPUT"

      - name: Report a recorded commit
        if: steps.plan.outputs.recorded == 'true'
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: echo "The record names ${COMMIT}, or a record pull request for it is pending. Nothing to publish." >> "$GITHUB_STEP_SUMMARY"

      # The annotated tag records who asked and from which run. The relayed
      # run finds its head at the commit, so it plans no second relay. The
      # dispatch retries, because a ref pushed a moment earlier may not yet
      # be indexed for workflows.
      - name: Tag the commit and dispatch this workflow at the tag
        if: steps.plan.outputs.relay == 'true' && steps.plan.outputs.recorded != 'true'
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
          TAG: ${{ steps.plan.outputs.tag }}
          TAGGED: ${{ steps.plan.outputs.tagged }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/publish-bindings.yaml
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          DISPATCH_ATTEMPTS: 6
          DISPATCH_PAUSE_SECONDS: 10
        run: |
          set -eu
          if [ "$TAGGED" != true ]; then
            git tag --annotate "$TAG" "$COMMIT" --message "Publication of ${COMMIT}, requested by ${GITHUB_ACTOR} from ${RUN_URL}"
            git push --quiet origin "refs/tags/${TAG}"
          fi
          attempt=1
          until gh workflow run publish-bindings.yaml --ref "refs/tags/${TAG}" --field "commit=${COMMIT}"; do
            if [ "$attempt" -ge "$DISPATCH_ATTEMPTS" ]; then
              echo "::error::the dispatch at ${TAG} failed ${DISPATCH_ATTEMPTS} times"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep "$DISPATCH_PAUSE_SECONDS"
          done
          echo "Dispatched the publication of ${COMMIT} at ${TAG}. The run appears at ${RUNS_URL}." >> "$GITHUB_STEP_SUMMARY"

      - name: Install orasust
        if: steps.plan.outputs.relay != 'true' && steps.plan.outputs.recorded != 'true'
        uses: ./.github/actions/install-orasust

      # The registry is read with the token, so a private package is named
      # as such instead of being rebuilt.
      - name: Read what the registry holds
        if: steps.plan.outputs.relay != 'true' && steps.plan.outputs.recorded != 'true'
        id: held
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          cargo run --quiet --manifest-path tools/workbench/Cargo.toml \
            --bin binding-publish -- --held --commit "$COMMIT" \
            >> "$GITHUB_OUTPUT"

      # The builder is the one source of every artifact name, of the ABI
      # list, and of the Maven version, which it reads from the wallet
      # manifest at the commit through the full history fetched above. This
      # one run, at the commit, feeds the build jobs and the publish job, so
      # they agree on what is built.
      - name: Name the artifacts
        if: steps.held.outputs.held == 'false'
        id: names
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: cargo run --quiet --manifest-path tools/workbench/Cargo.toml --bin build-binding-layer -- artifact --commit "$COMMIT" >> "$GITHUB_OUTPUT"

  android:
    needs: request
    if: ${{ needs.request.outputs.held == 'false' }}
    uses: ./.github/workflows/binding-layer-android.yaml
    with:
      ref: ${{ needs.request.outputs.commit }}
      abis: ${{ needs.request.outputs.abis }}
      abi_artifacts: ${{ needs.request.outputs.abi_artifacts }}
      abi_pattern: ${{ needs.request.outputs.abi_pattern }}
      repository: ${{ needs.request.outputs.android_repository }}
      version: ${{ needs.request.outputs.maven_version }}
      bundle: ${{ needs.request.outputs.bundle_android }}

  ios:
    needs: request
    if: ${{ needs.request.outputs.held == 'false' }}
    uses: ./.github/workflows/binding-layer-ios.yaml
    with:
      ref: ${{ needs.request.outputs.commit }}
      out: ${{ needs.request.outputs.ios_out }}
      bundle: ${{ needs.request.outputs.bundle_ios }}

  # The job downloads every bundle artifact of the commit by the pattern
  # the builder names, so a build that failed simply uploaded none. The
  # commit's tool pushes every bundle the registry lacks and refuses when a
  # platform the record requires has none, before it pushes anything. The
  # default branch's tool then records the digests it reads from the
  # registry. When the registry held both bundles the build jobs were
  # skipped, and only the record runs.
  publish:
    name: Publish and record
    needs: [request, android, ios]
    if: ${{ !cancelled() && needs.request.result == 'success' && needs.request.outputs.relay != 'true' && needs.request.outputs.recorded != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMMIT: ${{ needs.request.outputs.commit }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ github.token }}
      BUNDLES: publish
    steps:
      - name: Mint the publish token
        id: publish-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BINDING_PUBLISH_APP_ID }}
          private-key: ${{ secrets.BINDING_PUBLISH_APP_PRIVATE_KEY }}

      # The record commit is attributed to the App whose token pushes it.
      # The noreply address carries the bot user's id, which the API serves
      # for `<slug>[bot]`.
      - name: Identify the publish App
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token }}
          APP_SLUG: ${{ steps.publish-token.outputs.app-slug }}
        run: |
          set -eu
          bot="${APP_SLUG}[bot]"
          id="$(gh api "users/${bot}" --jq .id)"
          {
            echo "GIT_AUTHOR_NAME=${bot}"
            echo "GIT_COMMITTER_NAME=${bot}"
            echo "GIT_AUTHOR_EMAIL=${id}+${bot}@users.noreply.github.com"
            echo "GIT_COMMITTER_EMAIL=${id}+${bot}@users.noreply.github.com"
          } >> "$GITHUB_ENV"

      # The checkout is the commit, which is this run's head. The App's
      # token stays in the checkout for the record's push.
      - name: Checkout the commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.publish-token.outputs.token }}

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup
        with:
          workspaces: tools/workbench

      - name: Install orasust
        uses: ./.github/actions/install-orasust

      # Each artifact lands in its own directory under BUNDLES, named as
      # the artifact, and the tool reads the platform back from that name.
      - name: Download the bundles
        if: ${{ needs.request.outputs.held == 'false' }}
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.request.outputs.bundle_pattern }}
          path: ${{ env.BUNDLES }}

      - name: Push the bundles with the commit's tool
        if: ${{ needs.request.outputs.held == 'false' }}
        run: |
          cargo run --quiet --manifest-path tools/workbench/Cargo.toml \
            --bin binding-publish -- --push --commit "$COMMIT" --bundles "$BUNDLES"

      # The record branch starts at the default branch's head of this
      # moment, so the record merges without conflict whatever landed
      # during the builds, and the tool that writes it is the one the
      # record's checks run.
      - name: Switch to the default branch
        run: git switch --quiet --detach "origin/${DEFAULT_BRANCH}"

      # The tool writes `branch=<record branch>` when it pushed the record,
      # or when the branch existed already, and `recorded=true` when the
      # default branch records the commit.
      - name: Record the entry with the default branch's tool
        id: record
        run: |
          cargo run --quiet --manifest-path tools/workbench/Cargo.toml \
            --bin binding-publish -- --record --commit "$COMMIT" \
            >> "$GITHUB_OUTPUT"

      - name: Open the record pull request
        if: ${{ steps.record.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token }}
          BRANCH: ${{ steps.record.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          open="$(gh pr list --head "$BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[].number')"
          if [ -n "$open" ]; then
            echo "pull request #${open} records ${COMMIT}"
            exit 0
          fi
          gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "chore(bindings): record the publication of ${COMMIT}" \
            --body "The run ${RUN_URL} published the Prebuilt Bundles of ${COMMIT} and wrote this entry of the Publication Record. The checks \"Binding Layer manifest\" and \"Binding Layer changelog\" verify the entry against the registry. Merge this pull request when they pass."
