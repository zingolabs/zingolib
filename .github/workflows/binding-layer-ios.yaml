name: Binding Layer for iOS

# Builds the Binding Layer's two XCFrameworks and the Swift sources of the
# ZingoBindings package on this commit, with the builder of tools/workbench.

on:
  workflow_call:
    inputs:
      # The CI_IOS_RUNNER repository variable sets the runner label. The
      # fallback warp-macos-15-arm64-12x is WarpBuild's 12-vCPU M4 Pro
      # machine. The stock macos-15 label has three cores.
      runner:
        required: false
        type: string
        default: ${{ vars.CI_IOS_RUNNER || 'warp-macos-15-arm64-12x' }}
      # The commit to build. The publish workflow names a commit the
      # manifest lists, which is rarely the commit that triggered it.
      ref:
        required: false
        type: string
        default: ${{ github.sha }}
      # From one run of `build-binding-layer artifact` in the caller: the
      # directory the iOS plan writes, which this workflow uploads, and the
      # bundle name it uploads under. The plan takes no output flag, because
      # the shipped Package.swift reads one fixed directory.
      out:
        required: true
        type: string
      bundle:
        required: true
        type: string

jobs:
  slices:
    name: Build the ${{ matrix.target }} libraries
    strategy:
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME: ${{ github.workspace }}/.cargo
    steps:
      # The zl_ descriptor names the release tag that points at HEAD.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-tags: true

      # The action installs the toolchain rust-toolchain.toml pins, with
      # its components, and the builder adds the iOS target to it itself.
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache: "false"

      - name: Compute the cache key inputs
        id: cache-key
        shell: bash
        run: echo "rust_hash=$(rustc -Vv | grep commit-hash | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo registry, git database and target directories
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo/registry/index
            .cargo/registry/cache
            .cargo/git/db
            target/binding-layer/ios/wallet
            target/binding-layer/ios/proxy
            tools/workbench/target
          key: ios-${{ matrix.target }}-${{ steps.cache-key.outputs.rust_hash }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ios-${{ matrix.target }}-${{ steps.cache-key.outputs.rust_hash }}-

      - name: Install bindgen-cli
        run: cargo install --locked bindgen-cli

      # A dependency uses bindgen 0.69, which needs the simulator target and
      # SDK stated for the aarch64 simulator. The job environment carries
      # them, and the repository's .cargo/config.toml keeps its contents.
      - name: Environment for the iOS simulator
        shell: bash
        run: |
          sdkroot="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          flags="--target=arm64-apple-ios-simulator -isysroot $sdkroot"
          printf '%s\n' \
            "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim=$flags" \
            "CFLAGS_aarch64_apple_ios_sim=$flags" \
            "CXXFLAGS_aarch64_apple_ios_sim=$flags" \
            >> "$GITHUB_ENV"

      - name: Build the wallet and proxy libraries for the target
        run: |
          cargo run \
            --manifest-path tools/workbench/Cargo.toml \
            --bin build-binding-layer -- \
            ios --target ${{ matrix.target }}

      - name: Upload the libraries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.bundle }}-slice-${{ matrix.target }}
          path: target/binding-layer/ios/slices
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Clear the cargo caches that cargo recreates
        shell: bash
        run: rm -rf -- .cargo/registry/src .cargo/git/checkouts

      - name: Save the cargo registry, git database and target directories
        if: github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: |
            .cargo/registry/index
            .cargo/registry/cache
            .cargo/git/db
            target/binding-layer/ios/wallet
            target/binding-layer/ios/proxy
            tools/workbench/target
          key: ios-${{ matrix.target }}-${{ steps.cache-key.outputs.rust_hash }}-${{ hashFiles('**/Cargo.lock') }}

  build:
    name: Build the XCFrameworks and the Swift sources
    needs: slices
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME: ${{ github.workspace }}/.cargo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-tags: true

      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache: "false"

      - name: Compute the cache key inputs
        id: cache-key
        shell: bash
        run: echo "rust_hash=$(rustc -Vv | grep commit-hash | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo registry, git database and host target directories
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo/registry/index
            .cargo/registry/cache
            .cargo/git/db
            target/binding-layer/ios/wallet
            tools/workbench/target
          key: ios-assembly-${{ steps.cache-key.outputs.rust_hash }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ios-assembly-${{ steps.cache-key.outputs.rust_hash }}-

      - name: Download the libraries of every target
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.bundle }}-slice-*
          path: target/binding-layer/ios/slices
          merge-multiple: true

      # The plan ends with the Swift wire-contract test of the proxy crate,
      # which compiles against the Swift Binding Set the package ships and
      # asserts it against the crate's golden pins, which the Rust and
      # Kotlin suites share. The XCFrameworks hold iOS slices only, so the
      # builder runs the test on an iOS simulator it picks.
      - name: Assemble the Binding Layer and run the Swift wire-contract test
        run: |
          cargo run \
            --manifest-path tools/workbench/Cargo.toml \
            --bin build-binding-layer -- \
            ios --assemble

      - name: Upload the Binding Layer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.bundle }}
          path: ${{ inputs.out }}
          retention-days: 3
          overwrite: true

      - name: Clear the cargo caches that cargo recreates
        shell: bash
        run: rm -rf -- .cargo/registry/src .cargo/git/checkouts

      - name: Save the cargo registry, git database and host target directories
        if: github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: |
            .cargo/registry/index
            .cargo/registry/cache
            .cargo/git/db
            target/binding-layer/ios/wallet
            tools/workbench/target
          key: ios-assembly-${{ steps.cache-key.outputs.rust_hash }}-${{ hashFiles('**/Cargo.lock') }}
