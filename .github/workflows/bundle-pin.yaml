# bindings/pin is the npm package zingolib-bundle-pin, which consumers of
# the Binding Layer install to hold their Bundle Pin and fetch the Prebuilt
# Bundles. The package has no dependency, so the tests run on Node's own
# runner with no install. The publish workflow publishes the package when
# its version is absent from npm, so a change to the package must raise the
# version, and the second job fails when it does not.
#
# The check has its own workflow with no `paths` filter, for the reason
# no-duplicated-code.yaml states: a required check must report on every pull
# request.
name: Bundle Pin package

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [stable, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle-pin:
    name: Bundle Pin package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bindings/pin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the tests
        run: node --test test/*.test.mjs

      - name: Check the published files
        run: npm pack --dry-run

      # A pull request that changes the package must name a version npm
      # does not hold, or the publish workflow would publish nothing.
      - name: Check that a changed package raises its version
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git diff --quiet "$BASE" -- bin lib package.json; then
            echo "The package is unchanged."
            exit 0
          fi
          version="$(node --print "require('./package.json').version")"
          if npm view "zingolib-bundle-pin@${version}" version >/dev/null 2>&1; then
            echo "npm already holds zingolib-bundle-pin@${version}; raise the version in bindings/pin/package.json."
            exit 1
          fi
          echo "zingolib-bundle-pin@${version} is unpublished."
