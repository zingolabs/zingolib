name: Binding Layer AAR

# Packages the Binding Layer's AAR from libraries that zingo-mobile's
# android-build.yaml already built in this run. It compiles no Rust. The
# Gradle library takes the prebuilt output, compiles the Kotlin bindings,
# and bundles the AAR.

on:
  workflow_call:
    inputs:
      # The Android key from zingo-mobile's create-cache-key.yaml, which
      # names the entries that android-build.yaml saved.
      cache-key:
        required: true
        type: string
      # A JSON list of the ABIs to package. Each one needs an
      # android-build.yaml job in the calling run.
      abis:
        required: true
        type: string

jobs:
  package:
    name: Package the AAR
    runs-on: ubuntu-24.04
    steps:
      # zingo-mobile's restore action writes under zingolib/, where its own
      # checkout holds the submodule, so the checkout goes there.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: zingolib

      # One restore per ABI. The ABIs share one output directory, and the
      # action points Gradle at it. The action is pinned to the commit that
      # ci-pr.yaml pins zingo-mobile's workflows to, and the two move
      # together.
      - name: Restore x86_64
        if: ${{ contains(fromJSON(inputs.abis), 'x86_64') }}
        uses: zingolabs/zingo-mobile/.github/actions/binding-layer-android@3e0cb504bd82a23230a6616b02289d242ffede74
        with:
          abi: x86_64
          cache-key: ${{ inputs.cache-key }}

      - name: Restore x86
        if: ${{ contains(fromJSON(inputs.abis), 'x86') }}
        uses: zingolabs/zingo-mobile/.github/actions/binding-layer-android@3e0cb504bd82a23230a6616b02289d242ffede74
        with:
          abi: x86
          cache-key: ${{ inputs.cache-key }}

      - name: Restore arm64-v8a
        if: ${{ contains(fromJSON(inputs.abis), 'arm64-v8a') }}
        uses: zingolabs/zingo-mobile/.github/actions/binding-layer-android@3e0cb504bd82a23230a6616b02289d242ffede74
        with:
          abi: arm64-v8a
          cache-key: ${{ inputs.cache-key }}

      - name: Restore armeabi-v7a
        if: ${{ contains(fromJSON(inputs.abis), 'armeabi-v7a') }}
        uses: zingolabs/zingo-mobile/.github/actions/binding-layer-android@3e0cb504bd82a23230a6616b02289d242ffede74
        with:
          abi: armeabi-v7a
          cache-key: ${{ inputs.cache-key }}

      - name: Install the NDK that the AAR declares
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Bundle the AAR
        run: gradle --project-dir zingolib/bindings/android bundleReleaseAar

      - name: Verify the AAR carries both libraries for every ABI
        env:
          ABIS: ${{ join(fromJSON(inputs.abis), ' ') }}
        run: |
          set -eu
          aar="$(ls zingolib/bindings/android/build/outputs/aar/*-release.aar)"
          entries="$(unzip -Z1 "$aar")"
          for abi in $ABIS; do
            for library in libuniffi_zingo.so libzingo_nym_proxy_ffi.so; do
              echo "$entries" | grep --quiet --line-regexp "jni/$abi/$library"
            done
          done
