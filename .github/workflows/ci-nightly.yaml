name: CI (Nightly)

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yaml
    permissions:
      contents: read
      packages: write

  # The binding-layer-android job below builds x86_64 with the other ABIs,
  # so the per-PR workflow skips its own x86_64 build here. The per-PR
  # cargo-hack job builds every feature set instead of checking it, with
  # the flags that job alone holds. The called workflow runs its own plan.
  pr-checks:
    uses: ./.github/workflows/ci-pr.yaml
    permissions:
      contents: read
      packages: write
    with:
      skip-binding-layer-build: true
      cargo-hack-subcommand: build

  feature-census:
    name: Feature Census
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runner }}
    timeout-minutes: 90
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup

      # Removes each declared dependency feature in turn and checks without it.
      # One `cargo check` per feature, so this runs nightly rather than per PR.
      - name: Run feature-census
        run: cargo xtask feature-census --all

  # The online sync rate of the dev head against the newest first-parent
  # commit older than a day, in a real run-cli --online session (AGENTS.md,
  # the benchmark rule). Two release builds, two warm-ups and six measured
  # sessions take about two hours, so this runs on the schedule and on a
  # dispatch, never on a call from a pull request.
  sync-ab:
    name: Sync A/B (dev against the day before)
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runner }}
    timeout-minutes: 300
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup

      - name: Pick the arms
        id: arms
        run: |
          echo "before=$(git rev-list -n 1 --first-parent --before='24 hours ago' HEAD)" >> "$GITHUB_OUTPUT"
          echo "now=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compare the arms
        if: ${{ steps.arms.outputs.before != steps.arms.outputs.now }}
        run: |
          cargo xtask sync-ab "${{ steps.arms.outputs.before }}" "${{ steps.arms.outputs.now }}" \
            --birthday 2571710 --seconds 90 2>&1 | tee sync-ab.log

      - name: Keep the report
        if: ${{ always() && steps.arms.outputs.before != steps.arms.outputs.now }}
        uses: actions/upload-artifact@v7
        with:
          name: sync-ab-${{ github.sha }}
          path: sync-ab.log

  # The builder is the one source of every Binding Layer artifact name and
  # of the ABI list. One run of it here feeds the build workflows below, so
  # the names come from exactly one commit per run.
  binding-layer-names:
    name: Name the Binding Layer artifacts
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runner }}
    timeout-minutes: 10
    outputs:
      abis: ${{ steps.names.outputs.abis }}
      abi_artifacts: ${{ steps.names.outputs.abi_artifacts }}
      abi_pattern: ${{ steps.names.outputs.abi_pattern }}
      aar_glob: ${{ steps.names.outputs.aar_glob }}
      bundle_android: ${{ steps.names.outputs.bundle_android }}
      bundle_ios: ${{ steps.names.outputs.bundle_ios }}
      ios_out: ${{ steps.names.outputs.ios_out }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup

      - name: Name the artifacts
        id: names
        run: cargo xtask build-binding-layer artifact --commit "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # The nightly tier of zingolib/0054: the four Android ABIs in one AAR,
  # and both XCFrameworks with the Swift sources on macOS. Each job runs
  # the builder on this commit.
  binding-layer-android:
    needs: [plan, binding-layer-names]
    uses: ./.github/workflows/binding-layer-android.yaml
    with:
      runner: ${{ fromJSON(needs.plan.outputs.plan).runner }}
      abis: ${{ needs.binding-layer-names.outputs.abis }}
      abi_artifacts: ${{ needs.binding-layer-names.outputs.abi_artifacts }}
      abi_pattern: ${{ needs.binding-layer-names.outputs.abi_pattern }}
      aar_glob: ${{ needs.binding-layer-names.outputs.aar_glob }}
      bundle: ${{ needs.binding-layer-names.outputs.bundle_android }}

  # The CI_IOS_RUNNER repository variable, when set, overrides the plan's
  # label, so a runner outage is a settings change and not a commit.
  binding-layer-ios:
    needs: [plan, binding-layer-names]
    uses: ./.github/workflows/binding-layer-ios.yaml
    with:
      runner: ${{ vars.CI_IOS_RUNNER || fromJSON(needs.plan.outputs.plan).ios_runner }}
      out: ${{ needs.binding-layer-names.outputs.ios_out }}
      bundle: ${{ needs.binding-layer-names.outputs.bundle_ios }}

  test:
    needs: plan
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read
      packages: write
    with:
      plan: ${{ needs.plan.outputs.plan }}
