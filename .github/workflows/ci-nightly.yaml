name: CI (Nightly)

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

jobs:

  # The binding-layer-android job below builds x86_64 with the other ABIs,
  # and the binding-layer-ios job builds the XCFramework on this commit,
  # so the per-PR workflow skips both of its Binding Layer builds here.
  # The per-PR cargo-hack job builds every feature set instead of checking
  # it, with the flags that job alone holds.
  pr-checks:
    uses: ./.github/workflows/ci-pr.yaml
    permissions:
      contents: read
      packages: write
    with:
      skip-binding-layer-build: true
      cargo-hack-subcommand: build

  # The online sync rate of the dev head against the newest first-parent
  # commit older than a day, in a real run-cli --online session (AGENTS.md,
  # the benchmark rule). Two release builds, two warm-ups and six measured
  # sessions take about two hours, so this runs on the schedule and on a
  # dispatch, never on a call from a pull request.
  sync-ab:
    name: Sync A/B (dev against the day before)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Pick the arms
        id: arms
        run: |
          echo "before=$(git rev-list -n 1 --first-parent --before='24 hours ago' HEAD)" >> "$GITHUB_OUTPUT"
          echo "now=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compare the arms
        if: ${{ steps.arms.outputs.before != steps.arms.outputs.now }}
        run: |
          makers sync-ab "${{ steps.arms.outputs.before }}" "${{ steps.arms.outputs.now }}" \
            --birthday 2571710 --seconds 90 2>&1 | tee sync-ab.log

      - name: Keep the report
        if: ${{ always() && steps.arms.outputs.before != steps.arms.outputs.now }}
        uses: actions/upload-artifact@v7
        with:
          name: sync-ab-${{ github.sha }}
          path: sync-ab.log
          overwrite: true

  # The testnet cells and the live staged probe, which no pull request
  # runs: the one end-to-end mixnet send in the repository, the ten cells
  # beside it that spend from the shared GloryGoddess wallet against the
  # testnet indexer the suite names, and the nakednet probe of the
  # mainnet Default Indexer. They reach networks the repository does not
  # operate, so the run step may fail, or run out its ninety minutes,
  # without failing the nightly (ruled 2026-10-22); the step summary
  # names each cell's outcome and the log is the artifact. The cells run
  # one at a time through the nextest testnet group. The wallet one night
  # syncs is the cache the next night restores, so each night syncs a day
  # of blocks instead of the months since the committed snapshot; on a
  # miss, or when the restored wallet does not open, the environment
  # seeds the wallet from that snapshot.
  testnet-cells:
    name: Testnet cells and the live probe
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'warp-ubuntu-2404-x64-16x' }}
    timeout-minutes: 150
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # The cells spend from one shared wallet, so two of these jobs never
    # run at once: a dispatch queues behind the schedule instead of
    # sharing the wallet. Only this job holds the group, so Sync A/B and
    # the Binding Layer builds of a second run start at once.
    concurrency:
      group: testnet-faucet
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup
        with:
          workspaces: |
            .
            tools/workbench

      - name: Install nextest
        uses: ./.github/actions/install-nextest

      - name: Restore the faucet wallet
        uses: actions/cache@v4
        with:
          path: target/testnet/faucet
          key: testnet-faucet-${{ github.run_id }}
          restore-keys: testnet-faucet-

      # The mixnet cell spawns the proxy that the provisioning precedence
      # resolves (ADR 0024): the environment names the binary, and nothing
      # is copied onto PATH. The workbench tool builds the proxy and prints
      # the path cargo reports, so no step guesses the target directory.
      - name: Build the proxy
        id: proxy
        run: |
          proxy=$(cargo run --quiet --manifest-path tools/workbench/Cargo.toml \
            --bin bundle-nym-proxy -- --release)
          echo "path=${proxy}" >> "$GITHUB_OUTPUT"

      # `shell: bash` runs the script with pipefail, so the step carries
      # nextest's exit status through the tee instead of tee's.
      - name: Run the cells and the probe
        id: cells
        continue-on-error: true
        timeout-minutes: 90
        shell: bash
        env:
          ZINGO_NYM_PROXY: ${{ steps.proxy.outputs.path }}
        run: |
          cargo nextest run --verbose --profile ci --retries 0 \
            --package libtonode-tests --package zingolib \
            --features libtonode-tests/testnet,zingolib/nym \
            --run-ignored all \
            -E 'binary(testnet) | test(live_staged_probe_smoke)' \
            2>&1 | tee testnet-cells.log

      # The ci profile prints each failure twice, once as it happens and
      # once after the Summary line, so the summary reads the log only up
      # to that line: one row per cell, one panic per failure.
      - name: Summarize each cell
        if: ${{ always() && steps.cells.outcome != 'skipped' }}
        run: |
          run_section=$(sed '/^\s*Summary /q' testnet-cells.log)
          {
            echo '## Testnet cells and the live probe'
            echo
            echo '```'
            grep -E '^\s+(PASS|FAIL|TIMEOUT|SIGSEGV|SIGABRT|ABORT|LEAK) ' <<<"${run_section}" || echo 'no cell ran'
            grep -E "panicked at|^\s+Summary " <<<"${run_section}" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log
        if: ${{ always() && steps.cells.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: testnet-cells-${{ github.sha }}
          path: testnet-cells.log
          overwrite: true

  # The builder is the one source of every Binding Layer artifact name and
  # of the ABI list. One run of it here feeds the build workflows below, so
  # the names come from exactly one commit per run.
  binding-layer-names:
    name: Name the Binding Layer artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      abis: ${{ steps.names.outputs.abis }}
      abi_artifacts: ${{ steps.names.outputs.abi_artifacts }}
      abi_pattern: ${{ steps.names.outputs.abi_pattern }}
      android_repository: ${{ steps.names.outputs.android_repository }}
      maven_version: ${{ steps.names.outputs.maven_version }}
      bundle_android: ${{ steps.names.outputs.bundle_android }}
      bundle_ios: ${{ steps.names.outputs.bundle_ios }}
      ios_out: ${{ steps.names.outputs.ios_out }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup
        with:
          workspaces: tools/workbench

      # The Maven version joins the wallet crate's version at the commit
      # with the commit, so the workbench reads the manifest from git.
      - name: Name the artifacts
        id: names
        run: cargo run --quiet --manifest-path tools/workbench/Cargo.toml --bin build-binding-layer -- artifact --commit "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # The nightly tier of zingolib/0054: the four Android ABIs in one AAR
  # inside the Maven layout, and the XCFramework with the Swift sources
  # on macOS. Each job runs the builder on this commit.
  binding-layer-android:
    needs: binding-layer-names
    uses: ./.github/workflows/binding-layer-android.yaml
    with:
      abis: ${{ needs.binding-layer-names.outputs.abis }}
      abi_artifacts: ${{ needs.binding-layer-names.outputs.abi_artifacts }}
      abi_pattern: ${{ needs.binding-layer-names.outputs.abi_pattern }}
      repository: ${{ needs.binding-layer-names.outputs.android_repository }}
      version: ${{ needs.binding-layer-names.outputs.maven_version }}
      bundle: ${{ needs.binding-layer-names.outputs.bundle_android }}

  binding-layer-ios:
    needs: binding-layer-names
    uses: ./.github/workflows/binding-layer-ios.yaml
    with:
      out: ${{ needs.binding-layer-names.outputs.ios_out }}
      bundle: ${{ needs.binding-layer-names.outputs.bundle_ios }}

