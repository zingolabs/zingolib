name: CI (Nightly)

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

jobs:

  # The binding-layer-android job below builds x86_64 with the other ABIs,
  # so the per-PR workflow skips its own x86_64 build here.
  pr-checks:
    uses: ./.github/workflows/ci-pr.yaml
    with:
      skip-binding-layer-build: true

  cargo-hack-build:
    name: Cargo Hack Build
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Run cargo-hack
        uses: zingolabs/infrastructure/.github/actions/cargo-hack@20485fed7a080e381130ed8120419dc81acae641
        with:
          hack-subcommand: build

  feature-census:
    name: Feature Census
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      # Removes each declared dependency feature in turn and checks without it.
      # One `cargo check` per feature, so this runs nightly rather than per PR.
      - name: Run feature-census
        run: cargo run --manifest-path tools/workbench/Cargo.toml --bin feature-census -- --all

  # The nightly tier of zingolib/0054: the four Android ABIs in one AAR,
  # and both XCFrameworks with the Swift sources on macOS. Each job runs
  # the builder on this commit.
  binding-layer-android:
    uses: ./.github/workflows/binding-layer-android.yaml
    with:
      abis: '["x86_64", "x86", "arm64-v8a", "armeabi-v7a"]'

  binding-layer-ios:
    uses: ./.github/workflows/binding-layer-ios.yaml

  test:
    uses: ./.github/workflows/test.yaml
