name: Test

on:
  workflow_call:
    inputs:
      # The JSON object ci-plan.yaml computes, passed down so this
      # workflow runs no plan job of its own.
      plan:
        required: true
        type: string
      nextest-flags:
        required: false
        type: string

env:
  NEXTEST-FLAGS: ${{ inputs.nextest-flags }}

# The image holds the toolchain, the system libraries, and nextest at the
# version .env.testing-artifacts pins, so neither job installs a tool.
jobs:
  build-test-artifacts:
    name: Build test artifacts
    container:
      image: ${{ fromJSON(inputs.plan).image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ${{ fromJSON(inputs.plan).runner }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup

      - name: Build and archive tests
        run: |
          cargo nextest archive --verbose \
            --workspace \
            --archive-file nextest-archive-normal.tar.zst

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive-normal
          path: nextest-archive-normal.tar.zst
          overwrite: true

  run-tests:
    name: Run normal tests
    runs-on: ${{ fromJSON(inputs.plan).runner }}
    timeout-minutes: 90
    needs: build-test-artifacts
    env:
      RUSTFLAGS: -D warnings
    container:
      image: ${{ fromJSON(inputs.plan).image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(inputs.plan).partitions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: create binaries dir
        run: mkdir -p ./test_binaries/bins

      - name: Symlink lightwalletd and zcash binaries
        run: ln -s /usr/bin/lightwalletd /usr/bin/zainod /usr/bin/zebrad ./test_binaries/bins/

      - name: Download normal archive
        uses: actions/download-artifact@v8
        with:
          name: nextest-archive-normal

      # The partition count is the matrix's length, so the plan's list is
      # the one statement of the shard count.
      - name: Run normal tests
        run: |
          cargo nextest run --verbose --profile ci --retries 0 \
            --archive-file nextest-archive-normal.tar.zst \
            --workspace-remap ./ \
            --partition count:${{ matrix.partition }}/${{ strategy.job-total }} \
            ${{ env.NEXTEST-FLAGS }}
