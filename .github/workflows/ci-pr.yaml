name: CI

on:
  workflow_call:
    inputs:
      # The nightly builds every ABI and packages one AAR from them, so it
      # skips this workflow's x86_64 build.
      skip-binding-layer-build:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "bindings/**"
      - "**/*.udl"
      - "**/uniffi.toml"
      - ".github/workflows/**"
  push:
    branches: [stable, dev]

# One CI tree per pull request: a new commit on a PR'd branch cancels the
# superseded commit's still-running jobs (including the container test
# matrix called through test.yaml), returning those runners to the pool.
# Pushes to stable/dev group by ref but never cancel a running tree —
# GitHub instead collapses any queued runs behind it to the newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reject-trailing-whitespace:
    uses: zingolabs/infrastructure/.github/workflows/trailing-whitespace.yaml@20485fed7a080e381130ed8120419dc81acae641

  cargo-checkmate:
    uses: ./.github/workflows/cargo-checkmate.yaml

  cargo-hack-check:
    name: Cargo Hack Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Run cargo-hack
        uses: zingolabs/infrastructure/.github/actions/cargo-hack@20485fed7a080e381130ed8120419dc81acae641
        with:
          hack-subcommand: check

  # zingo-netutils is excluded from the root workspace and owns its own
  # Cargo.lock (so a future `nym` build resolves independently of the
  # zcash crypto-common pin, ADR 0011). The --workspace jobs above and the
  # nextest archive in test.yaml therefore skip it; this job restores its
  # coverage against its own manifest.
  netutils-standalone:
    name: zingo-netutils (standalone workspace)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zingo-netutils

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Format
        run: cargo fmt --manifest-path zingo-netutils/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path zingo-netutils/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path zingo-netutils/Cargo.toml --all-features

      # Membership in the root workspace used to gate rustdoc through
      # checkmate's doc phase; clippy does not run rustdoc lints, so the
      # standalone workspace needs its own doc gate.
      - name: Doc
        run: cargo doc --manifest-path zingo-netutils/Cargo.toml --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The Binding Layer's two workspaces, zingo-ffi and the proxy crate, stand
  # outside the root and zingo-netutils workspaces (zingolib/0054), so the
  # jobs above skip them. This job lints and tests both. A zingolib change
  # that breaks the Binding Layer's surface fails here, in its own PR.
  binding-layer:
    name: Binding Layer (zingo-ffi, proxy)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            zingo-ffi
            zingo-netutils/nym-proxy-ffi

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Format
        run: |
          cargo fmt --manifest-path zingo-ffi/Cargo.toml --all --check
          cargo fmt --manifest-path zingo-netutils/nym-proxy-ffi/Cargo.toml --check

      - name: Clippy
        run: |
          cargo clippy --manifest-path zingo-ffi/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path zingo-netutils/nym-proxy-ffi/Cargo.toml --all-targets -- -D warnings

      # The live-mixnet test stays behind its feature, which this step
      # leaves off, so no test here reaches the Nym network.
      - name: Test
        run: |
          cargo test --manifest-path zingo-ffi/Cargo.toml
          cargo test --manifest-path zingo-netutils/nym-proxy-ffi/Cargo.toml

      # The live test reaches the real Nym network, so it may fail on the
      # network without failing the check (zingolib/0054). One thread keeps
      # its cases from sharing the proxy. The timeout bounds a stuck
      # network: the test's four cases each allow 180 seconds to start and
      # 90 seconds to stop, which is 18 minutes, and the rest is the build.
      - name: Live mixnet start (may fail on the network)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          cargo test --manifest-path zingo-netutils/nym-proxy-ffi/Cargo.toml \
            --features live-mixnet --test live_mixnet -- --test-threads=1

  # The per-PR tier of zingolib/0054: the x86_64 libraries, the Kotlin
  # bindings, and the AAR. zingo-mobile's android-build.yaml runs the
  # builder on this commit, as it does in zingo-mobile's CI and in the
  # nightly, so one definition builds an ABI everywhere. The three jobs
  # below share the key that names this commit's build. On a pull request
  # that commit is the merge commit, so every push builds once, cold, and
  # the saved entry serves re-runs.
  #
  # The zingo-mobile workflows are pinned to one commit, here and in
  # binding-layer-aar.yaml, so a change to their definitions reaches this
  # tier only through a bump of the pin. Their steps still check out
  # zingo-mobile's dev for its submodule action and its descriptor tool.
  # The nightly calls the workflows at dev.
  binding-layer-cache-key:
    if: ${{ inputs.skip-binding-layer-build != true }}
    uses: zingolabs/zingo-mobile/.github/workflows/create-cache-key.yaml@85e16d5a8828a2c531e3fc1dc2f61cd78a6244f4

  # The standard runner keeps this build off the zingo-android-native-16
  # pool, whose cap is sized to one zingo-mobile run.
  binding-layer-x86_64:
    needs: binding-layer-cache-key
    uses: zingolabs/zingo-mobile/.github/workflows/android-build.yaml@85e16d5a8828a2c531e3fc1dc2f61cd78a6244f4
    with:
      cache-key: ${{ needs.binding-layer-cache-key.outputs.cache-key }}
      arch: x86_64
      runner: ubuntu-24.04

  binding-layer-aar:
    needs: [binding-layer-cache-key, binding-layer-x86_64]
    uses: ./.github/workflows/binding-layer-aar.yaml
    with:
      cache-key: ${{ needs.binding-layer-cache-key.outputs.cache-key }}
      abis: '["x86_64"]'

  # The `nym` feature gates the mixnet transmission and price-fetch surfaces
  # (ADR 0011) in zingolib and zingo-cli. zingo-cli carries it as a default
  # feature (ADR 0026), so the --workspace jobs above compile the CLI's gated
  # code; zingolib's own default remains nym-off. This job adds zingolib's
  # gated tests and the CLI's explicit opt-out build, whose refusal strings
  # must keep compiling and rendering.
  nym-feature:
    name: nym feature (zingolib + zingo-cli)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Clippy
        run: cargo clippy -p zingolib -p zingo-cli --features nym --all-targets -- -D warnings

      # Whole suites, deliberately unfiltered: module-path filter lists rot
      # as gated tests land outside them (PR #2470 review, M6). Re-running
      # the ungated tests under the features is the price of a gate that
      # cannot silently go dark; everything here is deterministic and
      # mixnet-free.
      - name: Test zingolib under the nym features
        run: cargo test -p zingolib --features nym --lib

      - name: Test zingo-cli under the nym features
        run: cargo test -p zingo-cli --features nym --lib

      - name: Doc-test zingolib under the nym features
        run: cargo test -p zingolib --features nym --doc

      # The opt-out shape (`--no-default-features`, run-cli's `--clearnet`)
      # must keep building, and its typed refusals must keep rendering.
      - name: Test zingo-cli without the default nym feature
        run: cargo test -p zingo-cli --no-default-features --lib

  run-doc-tests:
    name: Run doc tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install protoc
        run: |
          if ! command -v protoc; then
             sudo apt-get update
             sudo apt-get install -y protobuf-compiler
          fi

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run doc tests
        run: cargo test --doc

  test:
    uses: ./.github/workflows/test.yaml
    with:
      nextest-flags: "-E 'not test(slow)'"
