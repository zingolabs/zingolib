name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
  push:
    branches: [stable, dev]

# One CI tree per pull request: a new commit on a PR'd branch cancels the
# superseded commit's still-running jobs (including the container test
# matrix called through test.yaml), returning those runners to the pool.
# Pushes to stable/dev group by ref but never cancel a running tree —
# GitHub instead collapses any queued runs behind it to the newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Maximum item privacy, enforced over the whole tree: the other jobs start
  # optimistically in parallel with this one and share warm build caches, but
  # a privacy failure reaps the entire run — the last step cancels every
  # in-flight job and returns its runner to the pool. Three layers run in
  # order — rustc's unreachable_pub, rustc's missing_docs, then cargo
  # public-api against the goldens in tools/workbench/goldens/public-api/.
  # The driver lives in the workbench crate; run it locally with
  #   cargo run --manifest-path tools/workbench/Cargo.toml --bin decent-exposure
  # and regenerate the goldens by appending `-- --bless`.
  decent_exposure:
    name: decent_exposure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # actions: write lets the reap step cancel this very run.
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # cargo public-api builds rustdoc JSON, which only nightly rustdoc emits.
      # The version is pinned because rustdoc's rendering of standard-library
      # paths drifts between nightlies and the goldens record that rendering,
      # so an unpinned `nightly` passes on a developer's machine and fails here
      # on a fresher toolchain. The driver names the same version in its
      # GOLDEN_NIGHTLY constant and runs the golden layer under it; keep this
      # line in step with tools/workbench/src/bin/decent-exposure.rs.
      - name: Install nightly for rustdoc JSON
        run: rustup toolchain install nightly-2026-04-23 --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            zingo-netutils
            tools/workbench

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      # Pinned to the version the goldens were generated with.
      - name: Install cargo-public-api
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.50.2

      - name: Enforce maximum item privacy
        run: cargo run --manifest-path tools/workbench/Cargo.toml --bin decent-exposure

      # Privacy failed: reap the whole run, deallocating every runner the
      # optimistic parallel start claimed.
      - name: Reap the run on privacy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  reject-trailing-whitespace:
    uses: zingolabs/infrastructure/.github/workflows/trailing-whitespace.yaml@20485fed7a080e381130ed8120419dc81acae641

  cargo-checkmate:
    uses: ./.github/workflows/cargo-checkmate.yaml

  cargo-hack-check:
    name: Cargo Hack Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Run cargo-hack
        uses: zingolabs/infrastructure/.github/actions/cargo-hack@20485fed7a080e381130ed8120419dc81acae641
        with:
          hack-subcommand: check

  # zingo-netutils is excluded from the root workspace and owns its own
  # Cargo.lock (so a future `nym` build resolves independently of the
  # zcash crypto-common pin, ADR 0011). The --workspace jobs above and the
  # nextest archive in test.yaml therefore skip it; this job restores its
  # coverage against its own manifest.
  netutils-standalone:
    name: zingo-netutils (standalone workspace)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zingo-netutils

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Format
        run: cargo fmt --manifest-path zingo-netutils/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path zingo-netutils/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path zingo-netutils/Cargo.toml --all-features

      # Membership in the root workspace used to gate rustdoc through
      # checkmate's doc phase; clippy does not run rustdoc lints, so the
      # standalone workspace needs its own doc gate.
      - name: Doc
        run: cargo doc --manifest-path zingo-netutils/Cargo.toml --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The `nym` feature gates the mixnet transmission and price-fetch surfaces
  # (ADR 0011) in zingolib and zingo-cli. It is off by default, so the
  # --workspace jobs above never compile it; this job builds and lints the
  # gated code and runs its deterministic, mixnet-free unit tests.
  nym-feature:
    name: nym feature (zingolib + zingo-cli)
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Clippy
        run: cargo clippy -p zingolib -p zingo-cli --features nym,nym-diary --all-targets -- -D warnings

      # Whole suites, deliberately unfiltered: module-path filter lists rot
      # as gated tests land outside them (PR #2470 review, M6). Re-running
      # the ungated tests under the features is the price of a gate that
      # cannot silently go dark; everything here is deterministic and
      # mixnet-free.
      - name: Test zingolib under the nym features
        run: cargo test -p zingolib --features nym,nym-diary --lib

      - name: Test zingo-cli under the nym features
        run: cargo test -p zingo-cli --features nym,nym-diary --lib

      - name: Doc-test zingolib under the nym features
        run: cargo test -p zingolib --features nym,nym-diary --doc

  run-doc-tests:
    name: Run doc tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install protoc
        run: |
          if ! command -v protoc; then
             sudo apt-get update
             sudo apt-get install -y protobuf-compiler
          fi

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run doc tests
        run: cargo test --doc

  test:
    uses: ./.github/workflows/test.yaml
    with:
      nextest-flags: "-E 'not test(slow)'"
