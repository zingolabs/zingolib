name: Ensure CI Image

# Resolves the content-addressed tag of the reproducible test image
# (ghcr.io/zingolabs/ci-build) and guarantees that the tag exists before
# any job pulls it. The computation itself lives in Makefile.toml
# (container_image_tag); this workflow only calls it, so the tag CI
# consumes and the tag `makers build-image` produces cannot drift.
#
# A probe that finds the tag ends the job in seconds. An absent tag is
# built here and pushed, inside the run that needs it, so the consumers
# depend on this job through `needs` instead of polling a registry.
# Replicates the zaino dev method (zingolabs/zaino compute-tag.yml,
# content-addressed tagging per zingolabs/zaino@d8754b72a) with the
# publish step folded in.

on:
  workflow_call:
    outputs:
      image-tag:
        description: "Content-addressed tag of the docker-ci image"
        value: ${{ jobs.ensure-image.outputs.image-tag }}

env:
  IMAGE: ghcr.io/zingolabs/ci-build

jobs:
  ensure-image:
    name: Ensure CI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.taggen.outputs.tag }}
    env:
      # The runner ships both podman and docker; force docker so the
      # image `makers build-image` produces is visible to `docker push`.
      CONTAINER_RUNTIME: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Compute the content-addressed image tag
        id: taggen
        run: |
          # The tag is the only 14-hex-char line the task prints;
          # cargo-make's INFO chatter shares stdout with it. The
          # install-action provides the `cargo-make` binary only, not
          # the `makers` alias, so invoke it as a cargo subcommand.
          TAG=$(cargo make compute-image-tag | grep -E '^[0-9a-f]{14}$')
          echo "Computed tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe the registry for the tag
        id: probe
        run: |
          # Only "manifest unknown" means the tag is absent. Any other
          # failure is a registry or network fault and is reported as
          # such, never mistaken for an absent tag.
          image="${IMAGE}:${{ steps.taggen.outputs.tag }}"
          if error=$(docker manifest inspect "${image}" 2>&1 >/dev/null); then
            echo "${image} is present"
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "${error}" | grep -qiE 'manifest unknown|name unknown'; then
            echo "${image} is absent"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::probe of ${image} failed: ${error}"
            exit 1
          fi

      - name: Refuse to publish from a fork
        if: ${{ steps.probe.outputs.present == 'false' && github.event.pull_request.head.repo.fork == true }}
        run: |
          echo "::error::${IMAGE}:${{ steps.taggen.outputs.tag }} is absent and a fork's token cannot publish it. A maintainer publishes it with 'cargo make build-image' and 'docker push'."
          exit 1

      - name: Build the image via the makers front door
        if: ${{ steps.probe.outputs.present == 'false' }}
        run: cargo make build-image

      - name: Push the image
        if: ${{ steps.probe.outputs.present == 'false' }}
        run: docker push "${IMAGE}:${{ steps.taggen.outputs.tag }}"
