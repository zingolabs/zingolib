# The workbench is its own workspace, so the root workspace's test jobs
# never compile its unit tests. The builder's plan tests live there, and a
# plan change that breaks them must fail the pull request.
#
# The job runs outside ci-pr.yaml because the dupes_gate tests run the
# real cargo-dupes, and dupes_gate.rs pins the rule that ci-pr.yaml never
# names the duplication gate: its paths filter would hold a pull request
# forever on a required check that never reports.
name: Workbench

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/workbench/**"
      - "rust-toolchain.toml"
      - ".github/workflows/workbench.yaml"
      - ".github/actions/**"
  push:
    branches: [stable, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workbench-standalone:
    name: workbench (standalone workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup
        with:
          workspaces: tools/workbench

      # The gate's workflow installs cargo-dupes under this same cache key,
      # so a pull request compiles it at most once.
      - name: Restore cargo-dupes
        id: cargo-dupes
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-dupes
          key: cargo-dupes-${{ hashFiles('tools/workbench/src/dupes_gate.rs') }}-${{ runner.os }}

      - name: Install cargo-dupes
        if: steps.cargo-dupes.outputs.cache-hit != 'true'
        run: cargo run --manifest-path tools/workbench/Cargo.toml --bin dupes-gate -- --install

      - name: Format
        run: cargo fmt --manifest-path tools/workbench/Cargo.toml --all --check

      # The registry feature compiles the binary that reaches the registry,
      # so the lint and the tests cover it too.
      - name: Clippy
        run: cargo clippy --manifest-path tools/workbench/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path tools/workbench/Cargo.toml --all-features
