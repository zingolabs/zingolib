name: Docker Image CI/CD
# Builds and publishes the reproducible test image
# (ghcr.io/zingolabs/ci-build) on request, tagged with the
# content-addressed tag `cargo xtask ci-plan` computes. Per-content tags,
# never rolling tags: ci-plan.yaml keys on tag presence, so a rolling tag
# would neither rebuild nor reproduce.
#
# The CI workflows publish an absent tag themselves through
# ci-plan.yaml, so this workflow is the manual path: a rebuild on
# demand, or a build-only check of a feature branch.
on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to GHCR. Set false to verify a build on a feature branch without publishing.'
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # The runner ships both podman and docker; force docker so the
      # image the build produces is visible to `docker push`.
      CONTAINER_RUNTIME: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: image
        run: |
          image="$(cargo xtask ci-plan image)"
          echo "Image: ${image}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Build the image
        run: cargo xtask image build

      - name: Push the image
        if: ${{ inputs.push }}
        run: docker push "${{ steps.image.outputs.image }}"
