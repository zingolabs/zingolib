name: Docker Image CI/CD
# Builds and publishes the reproducible test image
# (ghcr.io/zingolabs/ci-build) on request, tagged with the
# content-addressed tag Makefile.toml computes. Per-content tags, never
# rolling tags: ci-plan.yaml keys on tag presence, so a rolling tag
# would neither rebuild nor reproduce.
#
# The CI workflows publish an absent tag themselves through
# ci-plan.yaml, so this workflow is the manual path: a rebuild on
# demand, or a build-only check of a feature branch.
on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to GHCR. Set false to verify a build on a feature branch without publishing.'
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # The runner ships both podman and docker; force docker so the
      # image `makers build-image` produces is visible to `docker push`.
      CONTAINER_RUNTIME: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the content-addressed image tag
        id: taggen
        run: |
          # The tag is the only 14-hex-char line the task prints. The
          # install-action provides the `cargo-make` binary only, not
          # the `makers` alias, so invoke it as a cargo subcommand.
          TAG=$(cargo make compute-image-tag | grep -E '^[0-9a-f]{14}$')
          echo "Computed tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build the image via the makers front door
        run: cargo make build-image

      - name: Push the image
        if: ${{ inputs.push }}
        run: docker push "ghcr.io/zingolabs/ci-build:${{ steps.taggen.outputs.tag }}"
