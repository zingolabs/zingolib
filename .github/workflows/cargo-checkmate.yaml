name: Cargo Checkmate

on:
  workflow_call:

jobs:
  cargo-checkmate:
    name: Cargo Checkmate
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        phase: [build, check, clippy, doc, format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          if ! command -v protoc; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi

      - name: Run cargo-checkmate
        uses: zingolabs/infrastructure/.github/actions/cargo-checkmate@6b03f1ad04f8843d543fbae2a84360ba1c4812cc
        with:
          phase: ${{ matrix.phase }}
