name: Cargo Checkmate

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

jobs:
  cargo-checkmate:
    name: Cargo Checkmate
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        phase: [build, check, clippy, doc, format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The five phases share one GITHUB_JOB, so the phase keys the cache.
      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup
        with:
          key: ${{ matrix.phase }}

      - name: Run cargo-checkmate
        uses: zingolabs/infrastructure/.github/actions/cargo-checkmate@20485fed7a080e381130ed8120419dc81acae641
        with:
          phase: ${{ matrix.phase }}
