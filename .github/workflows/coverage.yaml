name: Coverage (Daily)

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yaml

  # The image holds the toolchain, the system libraries, and nextest at
  # the version .env.testing-artifacts pins; cargo-llvm-cov alone is
  # installed here.
  coverage:
    name: Coverage
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runner }}
    timeout-minutes: 180
    env:
      RUSTFLAGS: -D warnings
    container:
      image: ${{ fromJSON(needs.plan.outputs.plan).image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --security-opt seccomp=unconfined
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: create binaries dir
        run: mkdir -p ./test_binaries/bins

      - name: Symlink lightwalletd and zcash binaries
        run: ln -s /usr/bin/lightwalletd /usr/bin/zainod /usr/bin/zebrad ./test_binaries/bins/

      - name: Run instrumented tests
        run: cargo llvm-cov nextest --workspace --no-report

      - name: Generate LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Generate HTML report
        run: cargo llvm-cov report --html --output-dir coverage-html

      - name: Generate coverage badge
        run: |
          COVERAGE=$(cargo llvm-cov report --json \
            | jq '.data[0].totals.lines.percent' \
            | xargs printf '%.1f')
          if   [ "$(echo "$COVERAGE >= 80" | bc)" -eq 1 ]; then COLOR="brightgreen"
          elif [ "$(echo "$COVERAGE >= 60" | bc)" -eq 1 ]; then COLOR="yellow"
          else COLOR="red"; fi
          jq -n --arg pct "${COVERAGE}%" --arg color "$COLOR" \
            '{schemaVersion:1, label:"coverage", message:$pct, color:$color}' \
            > coverage-html/badge.json

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage-html
          destination_dir: coverage
          force_orphan: true
