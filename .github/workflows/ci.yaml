name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [stable, dev]

jobs:
  reject-trailing-whitespace:
    uses: zingolabs/infrastructure/.github/workflows/trailing-whitespace.yaml@f074c3a26bf2d56f5f8bf0ac3d47e0da0539918c

  cargo-checkmate:
    name: Cargo checkmate
    steps:
      - name: Install protoc
        run: |
          if ! command -v protoc; then
             sudo apt-get install -y protobuf-compiler
          fi
      - name: Cargo checkmate
        uses: zingolabs/infrastructure/.github/workflows/cargo-checkmate.yaml@f074c3a26bf2d56f5f8bf0ac3d47e0da0539918c

  cargo-hack-check:
    name: Cargo hack check
    steps:
      - name: Install protoc
        run: |
          if ! command -v protoc; then
             sudo apt-get install -y protobuf-compiler
          fi
      - name: Cargo hack check
        uses: zingolabs/infrastructure/.github/workflows/cargo-hack.yaml@f074c3a26bf2d56f5f8bf0ac3d47e0da0539918c
        with:
          hack-subcommand: check

  run-doc-tests:
    name: Run doc tests
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install protoc
        run: |
          if ! command -v protoc; then
             sudo apt-get install -y protobuf-compiler
          fi

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run doc tests
        run: cargo test --doc

  test:
    uses: ./.github/workflows/test.yaml
    with:
      nextest-flags: "-E 'not test(slow)'"
