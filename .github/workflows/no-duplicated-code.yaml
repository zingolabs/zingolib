# AGENTS.md states the rule, and xtask/src/dupes_gate.rs holds the gate:
# the `cargo xtask dupes-gate` task pins the cargo-dupes version and settings,
# installs that version, runs the check, and rejects a stale baseline entry.
#
# The gate has its own workflow with no `paths` filter. Branch protection
# requires the check `No duplicated code`, and GitHub holds a pull request
# forever on a required check that never reports, which the filter in
# ci-pr.yaml would cause on a pull request outside its paths.
name: No duplicated code

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [stable, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-duplicated-code:
    name: No duplicated code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust and the cargo cache
        uses: ./.github/actions/rust-setup

      - name: Restore or install cargo-dupes
        uses: ./.github/actions/cargo-dupes

      - name: Run dupes-gate
        run: cargo xtask dupes-gate
