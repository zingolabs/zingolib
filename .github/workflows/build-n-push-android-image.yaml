name: Android Builder Image

# Builds the Android tool image of bindings/android/docker/Dockerfile through
# the workbench's `build-binding-layer image`, which passes the pinned
# toolchain and every Android target exactly as a local build does, and
# publishes it under the tag that binding-layer-android.yaml runs in
# (binding_layer::PUBLISHED_ANDROID_IMAGE). The tag is sequential, so only a
# dispatch publishes: bump the tag in the workbench and the workflow together,
# dispatch this once, and the Android jobs pick the new image up. A push that
# changes the image's inputs builds it without publishing, which proves the
# Dockerfile and registers the workflow with GitHub, since a dispatch by name
# finds only workflows on the default branch or ones that have already run.

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to GHCR. Set false to verify a build without publishing.'
        type: boolean
        default: true
  push:
    paths:
      - 'bindings/android/docker/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/build-n-push-android-image.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # The runner ships both podman and docker; force docker so the image
      # the workbench builds is the one `docker push` sees.
      CONTAINER_RUNTIME: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # GHCR applies no pull rate limit, and the job's own token may push
      # the organisation's package, so no secret is needed.
      - name: Log in to GHCR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        id: image
        run: |
          # The workbench prints the tag it built, and nothing else.
          TAG=$(cargo xtask build-binding-layer image)
          echo "Built ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Push the image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
        run: docker push "${{ steps.image.outputs.tag }}"
