[workspace]
members = [
    "libtonode-tests",
    "darkside-tests",
    "zingo-cli",
    "zingolib",
    "zingo-memo",
    "pepper-sync",
    "zingo-price",
    "zingolib_testutils",
    "ffi/rust",
]
resolver = "2"

[workspace.dependencies]

# Protocol
bip0039 = { version = "0.13", features = ["rand"] }
bip32 = { version = "0.6.0-pre.1", default-features = false }
zip32 = "0.2.0"

# Zcash
incrementalmerkletree = "0.8.2"
orchard = "0.11.0"
sapling-crypto = "0.5.0"
shardtree = "0.6.1"
zcash_address = "0.10"
zcash_client_backend = { version = "0.21", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }
zcash_encoding = "0.3"
zcash_keys = { version = "0.12", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4"
zcash_primitives = "0.26"
zcash_proofs = "0.26"
zcash_protocol = "0.7"
zcash_transparent = "0.6"

# Zebra
zebra-chain = "5.0.0"

# Zingo-common
zingo-netutils = "1.1.0"
zingo_common_components = { git = "https://github.com/zingolabs/zingo-common.git", version = "0.2" }

# Parallel processing
crossbeam-channel = "0.5"
rayon = "1"

# Documentation
simple-mermaid = "0.2.0"

# Test Attributes
test-log = "0.2"

# Misc
append-only-vec = "0.1.7"
bech32 = "0.11.0"
bs58 = "0.5"
byteorder = "1"
bytes = "1"
chrono = "0.4"
clap = "4"
concat-idents = "1"
dirs = "6"
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
http-body = "1"
hyper-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["http2"] }
indoc = "2"
itertools = "0.14"
json = "0.12"
jubjub = "0.10"
log = "0.4"
log4rs = "1"
memuse = "0.2"
nonempty = "0.11.0"
portpicker = "0.1"
proptest = "1.6.0"
prost = "0.14"
rand = "0.8"
reqwest = { version = "0.12.15", default-features = false }
ring = "0.17.14"
rust_decimal = "1.37.2"
rust-embed = "8"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rustyline = "11"
secp256k1 = "0.29.1"
secrecy = "0.8"
serde = "1"
serde_json = "1"
shellwords = "1"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-rustls = "0.26"
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
webpki-roots = "0.25"

# Workspace
# zingo-memo = { path = "zingo-memo" } # NOTE: for development between releases
zingo-memo = "0.1.0"
zingo-price = { path = "zingo-price" }
# zingo-status = { path = "zingo-status" } # NOTE: for development between releases
zingo-status = "0.1.0"
pepper-sync = { path = "pepper-sync" }
zingolib = { path = "zingolib" }
zcash_local_net = { git = "https://github.com/zingolabs/infrastructure.git", rev = "e4714fd" }
zingo_test_vectors = { git = "https://github.com/zingolabs/infrastructure.git", rev = "e4714fd" }

[profile.test]
opt-level = 3

