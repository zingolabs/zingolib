#  The order of the members reflects a dimension of the dependency relation, the first four depend on
#     *  zingolib
#  which depends in turn, on the bottom 3.
#  This doesn't account for all dependency relations, for example, zingocli depends on zingoconfig directly (for now).
[workspace]
members = [
    "libtonode-tests",
    "darkside-tests",
    "zingocli",
    "zingolib",
    "zingo-netutils",
    "zingo-memo",
    "pepper-sync",
    "zingo-testvectors",
    "zingo-price",
    "zcash_services",
    "zcash_services_utils"
]
resolver = "2"

[workspace.dependencies]
bip0039 = { version = "0.12", features = [ "rand" ] }
bip32 = { version = "0.6.0-pre.1", default-features = false }

# Zcash
zip32 = "0.2.0"
orchard = "0.11.0"
sapling-crypto = "0.5.0"
incrementalmerkletree = "0.8.2"
shardtree = "0.6.1"
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "8be259c579762f1b0f569453a20c0d0dbeae6c07" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "8be259c579762f1b0f569453a20c0d0dbeae6c07", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }
zcash_encoding = { git = "https://github.com/zcash/librustzcash.git", rev = "8be259c579762f1b0f569453a20c0d0dbeae6c07" }
zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "8be259c579762f1b0f569453a20c0d0dbeae6c07", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = { git = "https://github.com/zcash/zcash_note_encryption.git" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "8be259c579762f1b0f569453a20c0d0dbeae6c07" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash.git", rev = "8be259c579762f1b0f569453a20c0d0dbeae6c07" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "8be259c579762f1b0f569453a20c0d0dbeae6c07" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash.git", rev = "8be259c579762f1b0f569453a20c0d0dbeae6c07" }

append-only-vec = "0.1.7"
bech32 = "0.11.0"
bs58 = "0.5"
byteorder = "1"
bytes = "1"
chrono = "0.4"
clap = "4"
concat-idents = "1"
dirs = "6"
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
http-body = "1"
hyper-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["http2"] }
indoc = "2"
itertools = "0.14"
json = "0.12"
jubjub = "0.10"
log = "0.4"
log4rs = "1"
memuse = "0.2"
nonempty = "0.11.0"
portpicker = "0.1"
proptest = "1.6"
prost = "0.13"
rand = "0.8"
reqwest = { version = "0.12.15", default-features = false }
ring = "0.17"
rusqlite = "0.32"
rust_decimal = "1.37.2"
rust-embed = "6"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rustyline = "11"
secp256k1 = "0.29.1"
secrecy = "0.8"
serde = "1"
serde_json = "1"
shellwords = "1"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-rustls = "0.26"
tokio-stream = "0.1.17"
tonic = { version = "0.12", features = [
    "tls",
    "tls-roots",
    "tls-webpki-roots",
] }
tonic-build = "0.12"
tower = { version = "0.5" }
tracing = "0.1"
tracing-subscriber = "0.3"

# Parallel processing
crossbeam-channel = "0.5"
rayon = "1"

# Zingolabs
zcash_services = { path = "zcash_services" }

# Workspace
testvectors = { package = "zingo-testvectors", path = "zingo-testvectors" }
zingo-memo = { path = "zingo-memo" }
zingo-netutils = { path = "zingo-netutils" }
zingo-price = { path = "zingo-price" }
zingo-status = { path = "zingo-status" }
pepper-sync = { path = "pepper-sync" }
zingolib = { path = "zingolib" }
webpki-roots = "0.25"

# Dependencies introduced zcash_services_*
getset = "0.1.6"
zebra-chain = "2.0.0"
zebra-node-services = "1.0.1"
zebra-rpc = "2.0.1"
sha2 = "0.10.9"

[patch.crates-io]
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "8be259c579762f1b0f569453a20c0d0dbeae6c07" }

[profile.test]
opt-level = 3
