#  The order of the members reflects a dimension of the dependency relation, the first four depend on
#     *  zingolib
#  which depends in turn, on the bottom 3.
#  This doesn't account for all dependency relations, for example, zingocli depends on zingoconfig directly (for now).
[workspace]
members = [
    "libtonode-tests",
    "darkside-tests",
    "zingocli",
    "zingolib",
    "zingo-netutils",
    "zingo-memo",
    "pepper-sync",
    "testvectors",
    "zingo-price",
]
resolver = "2"

[workspace.dependencies]
bip0039 = "0.12"
bip32 = { version = "0.6.0-pre.1", default-features = false }

zip32 = "0.2.0"
orchard = "0.11.0"
sapling-crypto = "0.5.0"
incrementalmerkletree = "0.8.2"
shardtree = "0.6.1"
zcash_address = "0.7.0"
zcash_client_backend = { version = "0.18.0" , features = [ "lightwalletd-tonic", "orchard", "transparent-inputs", "tor" ] }
zcash_encoding = "0.3.0"
zcash_keys = { version = "0.8.0" , features = [ "transparent-inputs", "sapling", "orchard" ] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.22.0"
zcash_proofs = "0.22.0"
zcash_protocol = "0.5.1"
zcash_transparent = "0.2.3"

append-only-vec = "0.1.7"
bech32 = "0.11.0"
bs58 = "0.5"
build_utils = { path = "./build_utils" }
byteorder = "1"
bytes = "1"
chrono = "0.4"
clap = "4"
concat-idents = "1"
dirs = "5"
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
http-body = "1"
hyper-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["http2"] }
indoc = "2"
itertools = "0.14"
json = "0.12"
jubjub = "0.10"
lazy_static = "1"
log = "0.4"
log4rs = "1"
memuse = "0.2"
nonempty = "0.11.0"
portpicker = "0.1"
proptest = "1"
prost = "0.13"
rand = "0.8"
reqwest = "0.12.15"
ring = "0.17"
rust_decimal = "1.37.1"
rust-embed = "6"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rustyline = "11"
secp256k1 = "0.29.1"
secrecy = "0.8"
serde = "1"
serde_json = "1"
shellwords = "1"
subtle = "2"
tempdir = "0.3"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-rustls = "0.26"
tonic = { version = "0.12", features = [
    "tls",
    "tls-roots",
    "tls-webpki-roots",
] }
tonic-build = "0.12"
tower = { version = "0.5" }
tracing = "0.1"
tracing-subscriber = "0.3"
webpki-roots = "0.26"

# Parallel processing
crossbeam-channel = "0.5"
rayon = "1"

testvectors = { path = "testvectors" }
zingo-memo = { path = "zingo-memo" }
zingo-netutils = { path = "zingo-netutils" }
zingo-price = { path = "zingo-price" }
zingo-status = { path = "zingo-status" }
pepper-sync = { path = "pepper-sync" }
zingolib = { path = "zingolib" }

[profile.test]
opt-level = 3
