[workspace]
members = [
    "libtonode-tests",
    "pepper-sync",
    "zingo-cli",
    "zingo-memo",
    "zingo-netutils",
    "zingo-price",
    "zingo-status",
    "zingolib",
    "zingolib_testutils",
]
resolver = "2"

[workspace.dependencies]
### Workspace
pepper-sync = { path = "pepper-sync" } # NOTE: for development between releases
zingo-memo = { path = "zingo-memo" } # NOTE: for development between releases
# zingo-memo = "0.1.1"
zingo-price = { path = "zingo-price" }
zingo-status = { path = "zingo-status" } # NOTE: for development between releases
# zingo-status = "0.2.1"
zingolib = { path = "zingolib" }

### Tests and Integration Tests
portpicker = "0.1"
tempfile = "3"
zcash_local_net = { git = "https://github.com/zingolabs/infrastructure.git", rev = "537f84d3d81b228c06ae82365f306ff364e164da" }
zingo_test_vectors = { git = "https://github.com/zingolabs/infrastructure.git", rev = "537f84d3d81b228c06ae82365f306ff364e164da" }

### Documentation
indoc = "2"
simple-mermaid = "0.2.0"

### Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

### Zingo-common
zingo-netutils = { path = "zingo-netutils", features = ["globally-public-transparent"] }
zingo_common_components = "0.4.0"

### Netutils
http-body-util = "0.1.3"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = [
    "aws-lc-rs",
    "http1",
    "tls12",
    "logging",
    "native-tokio",
] }
hyper-util = "0.1.20"
lightwallet-protocol = "0.3.0"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws_lc_rs",
    "logging",
    "tls12",
] }
tokio-stream = "0.1"
x509-parser = "0.18"

### Zcash
incrementalmerkletree = "0.8.2"
orchard = "0.14.0"
sapling-crypto = "0.7.0"
shardtree = "0.6.2"
zcash_address = "0.12.0"
zcash_client_backend = { version = "0.23.0", features = [
    "orchard",
    "transparent-inputs",
] }
zcash_encoding = "0.4.0"
zcash_keys = { version = "0.14.0", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.28.0"
zcash_proofs = "0.28.0"
zcash_protocol = "0.9.0" # public API (TODO: remove from public API)
zcash_transparent = "0.8.0"

### Blockchain Protocol
bip0039 = { version = "0.14", features = ["rand"] }
bip32 = { version = "0.6.0-pre.1", default-features = false }
zip32 = "0.2.0"

### Cryptographic
hmac = "0.12"
jubjub = "0.10.0"
secp256k1 = "0.31.1"
sha2 = "0.10"
secrecy = "0.8"
subtle = "2.6.1"
bech32 = "0.11.0"
bs58 = "0.5"

# Parallel processing
crossbeam-channel = "0.5"
rayon = "1"

# Encoding
byteorder = "1"
hex = "0.4"
json = "0.12"
serde = "1"
serde_json = "1"

### Network
http = "1"
reqwest = { version = "0.12.15", default-features = false }
# aws-lc-rs is the workspace's sole rustls CryptoProvider (ring is excised);
# prefer-post-quantum leads outbound handshakes with the X25519MLKEM768
# hybrid group. Runtime installation is first-install-wins via
# zingo_netutils::crypto::ensure_default_crypto_provider, so downstream
# embedders that install their own provider first keep it.
rustls = { version = "0.23.40", features = ["prefer-post-quantum"] }
tonic = { version = "0.14", features = ["tls-webpki-roots", "tls-aws-lc"] }
prost = "0.14"

### Async
futures = "0.3"
tokio = "1"

### Error interface
thiserror = "2"

### Internal data
append-only-vec = "0.1.7"
itertools = "0.14"
nonempty = "0.11.0"
rust_decimal = "1.37.2"
rustyline = "17.0.2"
shellwords = "1"

### OS hooks
chrono = "0.4"
clap = "4"
dirs = "6"
memuse = "0.2"
rand = "0.8"

### Misc / not-yet-grouped
rust-embed = "8"

[profile.test]
opt-level = 3

[patch.crates-io]
time = { git = "https://github.com/time-rs/time", tag = "v0.3.47" }
