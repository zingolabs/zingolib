[workspace]
members = [
    "libtonode-tests",
    "pepper-sync",
    "zingo-cli",
    "zingo-memo",
    "zingo-net-diag",
    "zingo-price",
    "zingo-status",
    "zingolib",
    "zingolib_testutils",
    "zingo-ffi/lib",
    "zingo-ffi/uniffi-bindgen",
]
# zingo-netutils is intentionally NOT a member: it carries its own [workspace]
# and Cargo.lock so it can be built standalone with the `nym` feature, whose
# nym-sdk stack needs `crypto-common ^0.2`. That was irreconcilable in a shared
# lock while zcash_primitives 0.29 and 0.30 pinned `crypto-common
# =0.2.0-rc.1`. The 0.31 cohort resolves to a 0.2 release, so the lock
# conflict is gone, and readmitting the crate is a separate decision under
# zingo-adrs zingolib/0011. Members still consume netutils through the
# `zingo-netutils` path dependency below, resolved in THIS lockfile with
# `nym` off.
exclude = ["zingo-netutils"]
resolver = "2"

[workspace.dependencies]
### Workspace
pepper-sync = { path = "pepper-sync" } # NOTE: for development between releases
zingo-memo = { path = "zingo-memo" }   # NOTE: for development between releases
# zingo-memo = "0.1.1"
zingo-net-diag = { path = "zingo-net-diag" }
# default-features = false: the fetch machinery (socks5-fetch) is opt-in;
# zingolib re-enables it only under its `nym` feature (the mixnet-only
# price rule). The crate's own default keeps the fetch for standalone
# builds and tests.
zingo-price = { path = "zingo-price", default-features = false }
zingo-status = { path = "zingo-status" } # NOTE: for development between releases
# zingo-status = "0.2.1"
zingolib = { path = "zingolib" }

### Tests and Integration Tests
portpicker = "0.1"
# dev's dependency audit dropped this as unused, which held on dev alone: its
# only consumer there was the retired darkside-tests crate. zingolib's Ironwood
# migration proptests consume it, so the merge restores it.
proptest = "1.6.0"
tempfile = "3"
quote = "1"
syn = { version = "2", features = ["full"] }
zcash_local_net = { git = "https://github.com/zingolabs/infrastructure.git", rev = "89cf104a2416144d1bbbae30aca02bec062d1492" }
zingo_test_vectors = { git = "https://github.com/zingolabs/infrastructure.git", rev = "89cf104a2416144d1bbbae30aca02bec062d1492" }

### Documentation
indoc = "2"
simple-mermaid = "0.2.0"

### Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

### Zingo-common
zingo-netutils = { path = "zingo-netutils", features = ["globally-public-transparent"] }
zingo_common_components = "0.4.0"
tokio-stream = "0.1"

### Zcash
incrementalmerkletree = "0.9.0"
orchard = "0.16.0"
sapling-crypto = "0.9.0"
shardtree = "0.8.0"
zcash_address = "=0.14.0-pre.1"
zcash_client_backend = { version = "=0.25.0-pre.1", features = [
    "orchard",
    "transparent-inputs",
] }
zcash_encoding = "0.5.0"
zcash_keys = { version = "=0.17.0-pre.1", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.5.1"
# non-standard-fees: exposes `fees::fixed`, used to pin the exact planned fee
# on Ironwood migration transactions.
zcash_primitives = { version = "=0.31.0-pre.1", features = ["non-standard-fees"] }
zcash_proofs = "=0.31.0-pre.1"
zcash_protocol = "=0.11.0-pre.0" # public API (TODO: remove from public API)
zcash_transparent = "=0.11.0-pre.1"
zcash_script = "0.6.0"

### Blockchain Protocol
bip0039 = { version = "0.14", features = ["rand"] }
bip32 = { version = "0.6.0", default-features = false }
zip32 = "0.3.0"

### Cryptographic
blake2b_simd = "1"
hmac = "0.12"
jubjub = "0.11.1"
secp256k1 = "0.33.1"
sha2 = "0.10"
secrecy = "0.8"
subtle = "2.6.1"
bech32 = "0.11.0"
bs58 = "0.5"

# Parallel processing
crossbeam-channel = "0.5"
rayon = "1"

# Encoding
byteorder = "1"
hex = "0.4"
json = "0.12"
serde = "1"
serde_json = "1"

### Network
http = "1"
reqwest = { version = "0.12.15", default-features = false }
# aws-lc-rs is the workspace's sole rustls CryptoProvider (ring is excised);
# prefer-post-quantum leads outbound handshakes with the X25519MLKEM768
# hybrid group. Runtime installation is first-install-wins via
# zingo_netutils::crypto::ensure_default_crypto_provider, so downstream
# embedders that install their own provider first keep it.
tonic = { version = "0.14", features = ["tls-webpki-roots", "tls-aws-lc"] }
prost = "0.14"

### Async
futures = "0.3"
tokio = "1"

### Error interface
thiserror = "2"

### Binding Layer (zingo-adrs zingolib/0054)
uniffi = "0.32.2"
android_logger = "0.11"
lazy_static = "1.4.0"
once_cell = "1"

### Internal data
append-only-vec = "0.1.7"
itertools = "0.14"
nonempty = "0.11.0"
rustyline = "18.0.0"
shellwords = "1"

### OS hooks
chrono = "0.4"
clap = { version = "4.6.5", features = ["derive"] }
dirs = "6"
memuse = "0.2"
rand = "0.10"

### Misc / not-yet-grouped
rust-embed = "8"

[profile.test]
opt-level = 3

# The profile that the Binding Layer builder uses for the mobile libraries,
# carried unchanged from the zingo-ffi workspace that the crates came from.
[profile.mobile]
inherits = "release"
debug = 1
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"
opt-level = "z"

[patch.crates-io]
# Ironwood (NU6.3) proto fields (CompactTx.ironwoodActions, TreeState.ironwoodTree,
# ShieldedProtocol.ironwood, ChainMetadata.ironwoodCommitmentTreeSize). The rev is
# upstream PR #6, which commits the bindings regenerated from the Ironwood protos
# as 0.4.0, so no workspace enables `rebuild-proto` and no build needs protoc.
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "02211904910a50218f8b15f6136b5b127f98e4cc" }
