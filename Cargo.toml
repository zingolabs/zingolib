[workspace]
members = [
    "libtonode-tests",
    "pepper-sync",
    "zingo-cli",
    "zingo-memo",
    "zingo-net-diag",
    "zingo-price",
    "zingo-status",
    "zingolib",
    "zingolib_testutils",
]
# zingo-netutils is intentionally NOT a member: it carries its own [workspace]
# and Cargo.lock so it can be built standalone with the `nym` feature, whose
# nym-sdk stack needs `crypto-common ^0.2` — irreconcilable in a shared lock
# with this workspace's `crypto-common =0.2.0-rc.1` pin (via zcash_primitives
# 0.30, which pins the same release candidate 0.29 did). Members still consume
# netutils through the `zingo-netutils` path dependency below, resolved in
# THIS lockfile with `nym` off. See docs/adr/0011-nym-mixnet-transmission.md.
exclude = ["zingo-netutils"]
resolver = "2"

[workspace.dependencies]
### Workspace
pepper-sync = { path = "pepper-sync" } # NOTE: for development between releases
zingo-memo = { path = "zingo-memo" }   # NOTE: for development between releases
# zingo-memo = "0.1.1"
zingo-net-diag = { path = "zingo-net-diag" }
# default-features = false: the fetch machinery (socks5-fetch) is opt-in;
# zingolib re-enables it only under its `nym` feature (the mixnet-only
# price rule). The crate's own default keeps the fetch for standalone
# builds and tests.
zingo-price = { path = "zingo-price", default-features = false }
zingo-status = { path = "zingo-status" } # NOTE: for development between releases
# zingo-status = "0.2.1"
zingolib = { path = "zingolib" }

### Tests and Integration Tests
portpicker = "0.1"
# dev's dependency audit dropped this as unused, which held on dev alone: its
# only consumer there was the retired darkside-tests crate. zingolib's Ironwood
# migration proptests consume it, so the merge restores it.
proptest = "1.6.0"
tempfile = "3"
zcash_local_net = { git = "https://github.com/zingolabs/infrastructure.git", rev = "537f84d3d81b228c06ae82365f306ff364e164da" }
zingo_test_vectors = { git = "https://github.com/zingolabs/infrastructure.git", rev = "537f84d3d81b228c06ae82365f306ff364e164da" }

### Documentation
indoc = "2"
simple-mermaid = "0.2.0"

### Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

### Zingo-common
zingo-netutils = { path = "zingo-netutils", features = ["globally-public-transparent"] }
zingo_common_components = "0.4.0"
tokio-stream = "0.1"

### Zcash
incrementalmerkletree = "0.8.2"
orchard = "0.15.0"
sapling-crypto = "0.7.0"
shardtree = "0.7.0"
zcash_address = "0.13.0"
zcash_client_backend = { version = "0.24.0-rc.7", features = [
    "orchard",
    "transparent-inputs",
] }
zcash_encoding = "0.4.0"
zcash_keys = { version = "0.16.1", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4.2"
# non-standard-fees: exposes `fees::fixed`, used to pin the exact planned fee
# on Ironwood migration transactions.
zcash_primitives = { version = "0.30.0", features = ["non-standard-fees"] }
zcash_proofs = "0.30.0"
zcash_protocol = "0.10.4" # public API (TODO: remove from public API)
zcash_transparent = "0.10.0"

### Blockchain Protocol
bip0039 = { version = "0.14", features = ["rand"] }
bip32 = { version = "0.6.0-pre.1", default-features = false }
zip32 = "0.2.0"

### Cryptographic
blake2b_simd = "1"
hmac = "0.12"
jubjub = "0.10.0"
secp256k1 = "0.31.1"
sha2 = "0.10"
secrecy = "0.8"
subtle = "2.6.1"
bech32 = "0.11.0"
bs58 = "0.5"

# Parallel processing
crossbeam-channel = "0.5"
rayon = "1"

# Encoding
byteorder = "1"
hex = "0.4"
json = "0.12"
serde = "1"
serde_json = "1"

### Network
http = "1"
reqwest = { version = "0.12.15", default-features = false }
# aws-lc-rs is the workspace's sole rustls CryptoProvider (ring is excised);
# prefer-post-quantum leads outbound handshakes with the X25519MLKEM768
# hybrid group. Runtime installation is first-install-wins via
# zingo_netutils::crypto::ensure_default_crypto_provider, so downstream
# embedders that install their own provider first keep it.
rustls = { version = "0.23.40", features = ["prefer-post-quantum"] }
tonic = { version = "0.14", features = ["tls-webpki-roots", "tls-aws-lc"] }
prost = "0.14"

### Async
futures = "0.3"
tokio = "1"

### Error interface
thiserror = "2"

### Internal data
append-only-vec = "0.1.7"
itertools = "0.14"
nonempty = "0.11.0"
rustyline = "18.0.0"
shellwords = "1"

### OS hooks
chrono = "0.4"
clap = { version = "4.6.5", features = ["derive"] }
dirs = "6"
memuse = "0.2"
rand = "0.8"

### Misc / not-yet-grouped
rust-embed = "8"

[profile.test]
opt-level = 3

[patch.crates-io]
# Ironwood (NU6.3) proto fields (CompactTx.ironwoodActions, TreeState.ironwoodTree,
# ShieldedProtocol.ironwood, ChainMetadata.ironwoodCommitmentTreeSize). The rev is
# upstream main after PR #5 merged the Ironwood protos; the crate version is still
# 0.3.0. The generated code on that rev predates the proto change, which is why the
# workspace dependency enables `rebuild-proto`.
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }
