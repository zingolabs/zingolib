[workspace]
members = [
    "darkside-tests",
    "libtonode-tests",
    "pepper-sync",
    "zingo-cli",
    "zingo-memo",
    "zingo-netutils",
    "zingo-price",
    "zingo-status",
    "zingolib",
    "zingolib_testutils",
]
resolver = "2"

[workspace.dependencies]
### Workspace
pepper-sync = { path = "pepper-sync" } # NOTE: for development between releases
zingo-memo = { path = "zingo-memo" }   # NOTE: for development between releases
# zingo-memo = "0.1.1"
zingo-price = { path = "zingo-price" }
zingo-status = { path = "zingo-status" } # NOTE: for development between releases
# zingo-status = "0.2.1"
zingolib = { path = "zingolib" }

### Tests and Integration Tests
portpicker = "0.1"
proptest = "1.6.0"
tempfile = "3"
test-log = "0.2"
zcash_local_net = { git = "https://github.com/zingolabs/infrastructure.git", rev = "84d9c979e4aa6de0fe6243cbce333c8e5b5603ad" }
zingo_test_vectors = { git = "https://github.com/zingolabs/infrastructure.git", rev = "84d9c979e4aa6de0fe6243cbce333c8e5b5603ad" }

### Documentation
indoc = "2"
simple-mermaid = "0.2.0"

### Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

### Zingo-common
zingo-netutils = { path = "zingo-netutils", features = [
    "globally-public-transparent",
] }
zingo_common_components = "0.4.0"

### Netutils
http-body-util = "0.1.3"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = [
    "ring",
    "http1",
    "tls12",
    "logging",
    "native-tokio",
] }
hyper-util = "0.1.20"
# The `rebuild-proto` feature regenerates the bindings from the patched
# crate's proto files (see the [patch.crates-io] entry), which carry the
# Ironwood fields the checked-in generated code lacks. Requires `protoc`.
# Drop the feature and the patch once upstream regenerates and publishes.
lightwallet-protocol = { version = "0.3.0", features = ["rebuild-proto"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
tokio-stream = "0.1"
x509-parser = "0.18"

### Zcash
incrementalmerkletree = "0.8.2"
orchard = "0.15.0-pre.1"
sapling-crypto = "0.7.0"
shardtree = "0.6.2"
zcash_address = "0.13.0-pre.0"
zcash_client_backend = { version = "0.23.0", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
] }
zcash_encoding = "0.4.0"
zcash_keys = { version = "0.15.0-pre.0", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4.1"
# non-standard-fees: exposes `fees::fixed`, used to pin the exact planned fee
# on Ironwood migration transactions.
zcash_primitives = { version = "0.29.0-pre.0", features = ["non-standard-fees"] }
zcash_proofs = "0.29.0-pre.0"
zcash_protocol = "0.10.0-pre.0" # public API (TODO: remove from public API)
zcash_transparent = "0.9.0-pre.0"

### Blockchain Protocol
bip0039 = { version = "0.14", features = ["rand"] }
bip32 = { version = "0.6.0-pre.1", default-features = false }
zip32 = "0.2.0"

### Cryptographic
blake2b_simd = "1"
jubjub = "0.10.0"
ring = "0.17.14"
secp256k1 = "0.31.1"
secrecy = "0.8"
subtle = "2.6.1"
bech32 = "0.11.0"
bs58 = "0.5"

# Parallel processing
crossbeam-channel = "0.5"
rayon = "1"

# Encoding
byteorder = "1"
hex = "0.4"
json = "0.12"
serde = "1"
serde_json = "1"

### Network
http = "1"
reqwest = { version = "0.12.15", default-features = false }
rustls = { version = "0.23.40", features = ["ring"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"

### Async
futures = "0.3"
futures-util = "0.3"
tokio = "1"

### Error interface
thiserror = "2"

### Internal data
append-only-vec = "0.1.7"
itertools = "0.14"
nonempty = "0.11.0"
rust_decimal = "1.37.2"
rustyline = "17.0.2"
shellwords = "1"

### OS hooks
chrono = "0.4"
clap = "4"
dirs = "6"
memuse = "0.2"
rand = "0.8"

### Misc / not-yet-grouped
rust-embed = "8"

[profile.test]
opt-level = 3

[patch.crates-io]
time = { git = "https://github.com/time-rs/time", tag = "v0.3.47" }

# Ironwood (NU6.3) proto fields (CompactTx.ironwoodActions, TreeState.ironwoodTree,
# ShieldedProtocol.ironwood, ChainMetadata.ironwoodCommitmentTreeSize). The rev is
# upstream main after PR #5 merged the Ironwood protos; the crate version is still
# 0.3.0. The generated code on that rev predates the proto change, which is why the
# workspace dependency enables `rebuild-proto`.
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }

# Ironwood (NU6.3) — zebra. Point zebra at the zingolabs Ironwood fork (ZIN-37,
# the add-ironwood-v6-value-pool work), built against orchard 0.15.0-pre.1 and
# `--cfg zcash_unstable="nu6.3"`. This is what removes the orchard 0.14/0.15
# split: zebra-chain 9.0.0 from crates.io pins orchard 0.14, which clashes with
# the librustzcash Ironwood stack below. We only need to patch the three crates
# this workspace names directly; their intra-workspace `path` deps
# (zebra-consensus, zebra-state, zebra-network, …, which also pull orchard)
# resolve from the same fork checkout, so the whole zebra subtree moves to
# orchard 0.15.0-pre.1.
zebra-chain = { git = "https://github.com/zcashfoundation/zebra", branch = "nu63-ironwood" }
zebra-rpc = { git = "https://github.com/zcashfoundation/zebra", branch = "nu63-ironwood" }
zebra-node-services = { git = "https://github.com/zcashfoundation/zebra", branch = "nu63-ironwood" }

# librustzcash. Consume the canonical upstream `zcash/librustzcash` main
# branch, pinned to a specific rev for reproducibility (its main is the
# internally-consistent latest). A source swap over the same crate names;
# `zcash_history` is included because zebra-chain (pulled in transitively)
# consumes it and a dependency's own `[patch]` table is ignored — only this
# top-level workspace's patches apply.
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_history = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
equihash = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
f4jumble = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }

# zip321 = { git = "https://github.com/zingolabs/librustzcash", branch = "feat/ironwood" }

[workspace.metadata.cargo-shear]
ignored = ["tonic-prost"]
