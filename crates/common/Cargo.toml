[package]
name = "zingolib-common"
description = "The wallet data a zingo wallet file stores: the chain type, the keys, the blocks, transactions, notes and shard trees, the confirmation status, the price list, the sync state and the sync config, and their codecs, with the wallet memo encoding."
authors = ["<zingo@zingolabs.org>"]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/zingolabs/zingolib"
homepage = "https://github.com/zingolabs/zingolib"
license = "MIT"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["serialization"]
serialization = ["dep:jubjub", "dep:zcash_client_backend"]
# exposes test constructors for wallet types
test-features = []

[dependencies]
# Zingo
zingo_common_components.workspace = true

# Zcash
incrementalmerkletree.workspace = true
orchard.workspace = true
sapling-crypto.workspace = true
shardtree.workspace = true
zcash_address.workspace = true
zcash_client_backend = { workspace = true, optional = true, features = [
    "unstable-serialization",
] }
zcash_encoding.workspace = true
zcash_keys = { workspace = true, features = ["unstable"] }
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zcash_transparent = { workspace = true, features = ["transparent-inputs"] }

# Protocol
bip0039.workspace = true
bip32.workspace = true
zip32.workspace = true

# Cryptography
jubjub = { workspace = true, optional = true }
secrecy.workspace = true

thiserror.workspace = true

# Logging
tracing.workspace = true

# Metrics
memuse.workspace = true

# Serialization
byteorder.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
zcash_protocol = { workspace = true, features = ["local-consensus"] }
