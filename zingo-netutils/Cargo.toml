[package]
name = "zingo-netutils"
version = "5.0.1"
description = "network utility crate"
authors = ["zingo@zingolabs.org"]
edition = "2024"
repository = "https://github.com/zingolabs/zingolib"
homepage = "https://github.com/zingolabs/zingolib"
license = "MIT"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
http.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio-rustls.workspace = true
tonic.workspace = true
lightwallet-protocol.workspace = true
tokio-stream = { workspace = true, optional = true }

# Nym mixnet transport (ADR 0011), optional. These resolve ONLY in this
# crate's own lockfile — never the parent workspace's — because nym-sdk's
# transitive graph needs `crypto-common ^0.2`, irreconcilable with the
# parent's `crypto-common =0.2.0-rc.1` pin. That is why zingo-netutils is
# its own workspace (see [workspace] below and the root manifest's exclude).
#
# TLS-backend note: nym-sdk transitively links `ring` (via its cosmos
# credential core: nym-client-core -> cosmrs -> tendermint-rpc -> reqwest 0.11
# -> hyper-rustls 0.24 -> rustls 0.21, which predates rustls's aws-lc-rs
# backend). This workspace otherwise uses aws-lc-rs only. The ring is a ratified,
# unavoidable transitive exception (ADR 0011), confined to this standalone nym
# build and never the main wallet lock; upstream removal is tracked separately.
nym-sdk = { version = "1.21.2", optional = true }
nym-http-api-client = { version = "1.21.3", optional = true }
nym-validator-client = { version = "1.21.3", optional = true, default-features = false, features = [
    "http-client",
] }
tokio-socks = { version = "0.5", optional = true }
# The plain-HTTP leg the price fetch rides, dialed through the conduit's
# SOCKS5 proxy. The feature string is copied verbatim from the price
# crate it moved from: webpki roots rather than the platform verifier,
# because ADR 0021 rules that verification is the compiled-in Mozilla
# bundle on every platform, and no auto-selected provider, because
# `crypto::ensure_default_crypto_provider` installs aws-lc-rs first.
reqwest = { workspace = true, optional = true, default-features = false, features = [
    "cookies",
    "rustls-tls-webpki-roots-no-provider",
    "json",
    "socks",
] }
hyper-util = { version = "0.1.20", optional = true }
tower = { version = "0.5", optional = true }
tokio = { workspace = true, optional = true, features = [
    "time",
    "rt-multi-thread",
    "macros",
    "signal",
    # io-std + io-util back the nym-proxy binary's stdin-EOF parent watchdog.
    "io-std",
    "io-util",
] }
zingo-net-diag = { version = "0.1.0", path = "../zingo-net-diag", optional = true }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }

[features]
globally-public-transparent = ["dep:tokio-stream"]
ping-very-insecure = []
# Exposes `time::test`, the temporal parameters owned by tests. Enabled by
# downstream crates' dev-dependencies only, never by a production build.
testutils = []
# Wallet-side SOCKS5-dialing transmit (ADR 0011, consumption model A). Light —
# no nym-sdk, so it resolves in the main workspace's lockfile. The wallet
# enables this to route a transaction through the spawned nym-proxy's local
# SOCKS5 port.
socks5-transmit = [
    "dep:tokio-socks",
    "dep:hyper-util",
    "dep:tower",
    "dep:tokio",
    # Transmit failures render their cause chains over the one sanctioned
    # chain walk rather than a private copy of it. Std-only and
    # zero-dependency, so it resolves in both this crate's own lockfile and
    # the parent workspace's without coupling either.
    "dep:zingo-net-diag",
]
# The wallet-side SOCKS5-dialing HTTP fetch: one conduit-guarded request,
# classified into a typed zingo-net-diag failure. Light in the same sense
# as socks5-transmit — no nym-sdk — so it resolves in the parent
# workspace's lockfile.
socks5-fetch = [
    "dep:reqwest",
    "dep:zingo-net-diag",
]
nym = [
    "dep:nym-sdk",
    "dep:nym-http-api-client",
    "dep:nym-validator-client",
    "dep:tokio-socks",
    "dep:tokio",
    # The proxy binary health-gates readiness with a real GetLightdInfo round
    # trip through the mixnet, which lives in the socks5-transmit module.
    "socks5-transmit",
    # The provider connect race reports its exhausted attempts as typed
    # zingo-net-diag records (issue #2562). Std-only and zero-dependency, so
    # it resolves in this crate's own lockfile without coupling.
    "dep:zingo-net-diag",
]

# The spawnable mixnet proxy process (ADR 0011, consumption model A). Built
# only with the `nym` feature, in this crate's own lockfile; the wallet
# bundles and spawns it, then dials its local SOCKS5 port.
[[bin]]
name = "nym-proxy"
required-features = ["nym"]

[[bin]]
name = "live-indexer-discovery"
required-features = ["nym"]

[dev-dependencies]
tokio-stream.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
hyper.workspace = true
rustls-pemfile.workspace = true
# `test-util` enables paused-time tests (`start_paused`) for the per-attempt
# timeout regression test; dev-only, so the shipped graph is unchanged.
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
http-body-util.workspace = true
x509-parser.workspace = true

# zingo-netutils is its own workspace root (excluded from the parent's
# members) so that it owns a separate Cargo.lock. That independent
# resolution is what lets a future `nym` build here pull the nym-sdk stack
# — whose `crypto-common ^0.2` requirement cannot coexist in one lockfile
# with the parent workspace's `crypto-common =0.2.0-rc.1` pin. netutils has
# no zcash dependency, so its standalone graph carries no such pin.
[workspace]
resolver = "2"
members = ["webpki-verifier-shim"]

# Mirrors the parent workspace's entries for the dependencies netutils
# inherits, so `workspace = true` resolves against this workspace. Keep the
# versions and features in sync with the parent's [workspace.dependencies].
[workspace.dependencies]
http = "1"
rustls = { version = "0.23.40", features = ["prefer-post-quantum"] }
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws_lc_rs",
    "logging",
    "tls12",
] }
tonic = { version = "0.14", features = ["tls-webpki-roots", "tls-aws-lc"] }
lightwallet-protocol = { version = "0.3.0", features = ["rebuild-proto"] }
tokio-stream = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = [
    "aws-lc-rs",
    "http1",
    "tls12",
    "logging",
    "native-tokio",
] }
hyper-util = "0.1.20"
hyper = "1"
rustls-pemfile = "2"
reqwest = { version = "0.12.15", default-features = false }
tokio = "1"
http-body-util = "0.1.3"
x509-parser = "0.18"

# The same patches the parent workspace applies, needed for netutils's own
# standalone resolution: the Ironwood proto rev of lightwallet-protocol
# (paired with the `rebuild-proto` feature above) and the time v0.3.47 pin.
[patch.crates-io]
time = { git = "https://github.com/time-rs/time", tag = "v0.3.47" }
# ADR 0021 (zingolib#2531, amended 2026-08-10): this workspace's nym-stack
# TLS verifies against the compiled-in Mozilla bundle instead of
# rustls-platform-verifier's OS-trust-store integration, keeping
# verification byte-identical on every platform and the workspace free of
# hand-written unsafe. The stand-in lives in this workspace under the
# upstream crate's name; see the ADR for the update policy that keeps it
# tracking upstream.
rustls-platform-verifier = { path = "webpki-verifier-shim" }
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }
