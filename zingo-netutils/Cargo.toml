[package]
name = "zingo-netutils"
version = "6.0.0"
description = "network utility crate"
authors = ["zingo@zingolabs.org"]
edition = "2024"
repository = "https://github.com/zingolabs/zingolib"
homepage = "https://github.com/zingolabs/zingolib"
license = "MIT"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
http.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio-rustls.workspace = true
tonic.workspace = true
lightwallet-protocol.workspace = true
tokio-stream = { workspace = true, optional = true }

# Nym mixnet transport (zingo-adrs zingolib/0011), optional. The stack
# resolves in the root lockfile since PR #3037; members build with `nym`
# off, and only the proxy crate and ci-pr.yaml's nym feature job turn it on.
#
# TLS-backend note: nym-sdk transitively links `ring` (via its cosmos
# credential core: nym-client-core -> cosmrs -> tendermint-rpc -> reqwest 0.11
# -> hyper-rustls 0.24 -> rustls 0.21, which predates rustls's aws-lc-rs
# backend). The workspace otherwise uses aws-lc-rs only. The ring is a
# ratified, unavoidable transitive exception (ADR 0011) that compiles only
# under the `nym` feature; upstream removal is tracked separately.
#
# Every nym crate is pinned with `=`. nym-sdk stands at 1.21.6, and the 1.22
# releases of its sibling crates removed aliases it still needs, so a caret
# requirement on any one of them lets `cargo update` break the build.
nym-sdk = { version = "=1.21.6", optional = true }
nym-http-api-client = { version = "=1.21.6", optional = true }
nym-validator-client = { version = "=1.21.6", optional = true, default-features = false, features = [
    "http-client",
] }
tokio-socks = { version = "0.5", optional = true }
# The plain-HTTP leg the price fetch rides, dialed through the conduit's
# SOCKS5 proxy. The feature string is copied verbatim from the price
# crate it moved from: webpki roots rather than the platform verifier,
# because ADR 0021 rules that verification is the compiled-in Mozilla
# bundle on every platform, and no auto-selected provider, because
# `crypto::ensure_default_crypto_provider` installs aws-lc-rs first.
reqwest = { workspace = true, optional = true, default-features = false, features = [
    "rustls-tls-webpki-roots-no-provider",
    "socks",
] }
# A direct dependency, not only through `socks5-transmit`: GrpcIndexer builds
# its own HTTP connector so the connect timeout covers the TLS handshake (see
# `indexer_connector`). tonic already depends on it with these features, so
# nothing new enters the lockfile.
hyper-util = { version = "0.1.20", features = ["client-legacy", "tokio"] }
tower = { version = "0.5" }
tokio = { workspace = true, optional = true, features = [
    "time",
    "rt-multi-thread",
    "macros",
    "signal",
    # io-std + io-util back the nym-proxy binary's stdin-EOF parent watchdog.
    "io-std",
    "io-util",
] }
zingo-net-diag = { version = "0.1.0", path = "../zingo-net-diag", optional = true }
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
nym-socks5-proxy-helpers = { version = "=1.21.6", optional = true }
futures-channel = { version = "0.3", optional = true }
x509-parser.workspace = true
sha2 = "0.10"
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http2"] }

# Not used directly. Each is a transitive of nym-sdk whose 1.22 release
# broke the 1.21.6 build, and the `=` requirement here holds it at the
# cohort that compiles. The `nym` feature lists them so they stay optional.
nym-client-core-config-types = {version = "=1.21.6", optional = true }
nym-crypto = {version = "=1.21.6", optional = true }
nym-sphinx-types = {version = "=1.21.6", optional = true }
nym-sphinx = {version = "=1.21.6", optional = true }
nym-statistics-common = {version = "=1.21.6", optional = true }
nym-client-core = {version = "=1.21.6", optional = true }
nym-topology = {version = "=1.21.6", optional = true }
nym-bandwidth-fetcher = {version = "=1.21.6", optional = true }
nym-coconut-dkg-common = {version = "=1.21.6", optional = true }
nym-lp-data = {version = "=1.21.6", optional = true }

[features]
globally-public-transparent = ["dep:tokio-stream"]
ping-very-insecure = []
# Exposes `time::test`, the temporal parameters owned by tests. Enabled by
# downstream crates' dev-dependencies only, never by a production build.
testutils = []
# Wallet-side SOCKS5-dialing transmit (ADR 0011, consumption model A). Light —
# no nym-sdk, so it resolves in the main workspace's lockfile. The wallet
# enables this to route a transaction through the spawned nym-proxy's local
# SOCKS5 port.
socks5-transmit = [
    "dep:tokio-socks",
    "dep:tokio",
    # Transmit failures render their cause chains over the one sanctioned
    # chain walk rather than a private copy of it. Std-only and
    # zero-dependency, so it resolves in both this crate's own lockfile and
    # the parent workspace's without coupling either.
    "dep:zingo-net-diag",
]
# The wallet-side SOCKS5-dialing HTTP fetch: one conduit-guarded request,
# classified into a typed zingo-net-diag failure. Light in the same sense
# as socks5-transmit — no nym-sdk — so it resolves in the parent
# workspace's lockfile.
socks5-fetch = [
    "dep:reqwest",
    "dep:zingo-net-diag",
]
nym = [
    "dep:nym-sdk",
    # Used only by the closed-input-channel test under src/nym_proxy/:
    # the SOCKS5 connection runner and the channel its constructor takes.
    # A dev-dependency cannot be feature-gated and would compile the nym
    # stack for every netutils test build, so the two ride this feature.
    # Both already ship as nym-sdk transitives, so the graph gains no node.
    "dep:nym-socks5-proxy-helpers",
    "dep:futures-channel",
    "dep:nym-http-api-client",
    "dep:nym-validator-client",
    "dep:tokio-socks",
    "dep:tokio",
    # The proxy binary health-gates readiness with a real GetLightdInfo round
    # trip through the mixnet, which lives in the socks5-transmit module.
    "socks5-transmit",
    # The provider connect race reports its exhausted attempts as typed
    # zingo-net-diag records (issue #2562). Std-only and zero-dependency, so
    # it resolves in this crate's own lockfile without coupling.
    "dep:zingo-net-diag",
    # The following are pinned versions, we don't directly depend on them
    "dep:nym-client-core-config-types",
    "dep:nym-crypto",
    "dep:nym-sphinx-types",
    "dep:nym-sphinx",
    "dep:nym-statistics-common",
    "dep:nym-client-core",
    "dep:nym-topology",
    "dep:nym-bandwidth-fetcher",
    "dep:nym-coconut-dkg-common",
    "dep:nym-lp-data",
]

# The spawnable mixnet proxy process (ADR 0011, consumption model A). Built
# only with the `nym` feature, in this crate's own lockfile; the wallet
# bundles and spawns it, then dials its local SOCKS5 port.
[[bin]]
name = "nym-proxy"
required-features = ["nym"]

[[bin]]
name = "live-indexer-discovery"
required-features = ["nym"]

[dev-dependencies]
tokio-stream.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
hyper.workspace = true
rustls-pemfile.workspace = true
# `test-util` enables paused-time tests (`start_paused`) for the per-attempt
# timeout regression test; dev-only, so the shipped graph is unchanged.
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
http-body-util.workspace = true

