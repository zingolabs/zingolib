[package]
name = "zingo-uniffi-bindgen"
version = "0.1.0"
edition = "2024"
description = "Project-local uniffi-bindgen binaries for the wallet and the Nym proxy shim."
publish = false

# Two binaries, one per uniffi version in this repository. Each generates the
# bindings for the crate that compiles against that version.
[[bin]]
name = "zingo-uniffi-bindgen"
path = "src/bin/zingo-uniffi-bindgen.rs"

[[bin]]
name = "zingo-wallet-uniffi-bindgen"
path = "src/bin/zingo-wallet-uniffi-bindgen.rs"

[dependencies]
# The shim's version (`zingo-nym-proxy-ffi`, rust/nym-proxy-ffi).
uniffi_shim = { package = "uniffi", version = "0.28", features = ["cli"] }
# The wallet's version (`zingo`, rust/lib). Keep equal to the workspace `uniffi` pin.
uniffi_wallet = { package = "uniffi", version = "0.29", features = ["cli"] }
