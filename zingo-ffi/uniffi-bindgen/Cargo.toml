[package]
name = "zingo-uniffi-bindgen"
version = "0.1.0"
edition = "2024"
description = "Project-local uniffi-bindgen for the wallet and the Nym proxy shim."
publish = false

# One binary generates both crates' bindings in library mode from their
# compiled libraries.
[[bin]]
name = "zingo-uniffi-bindgen"
path = "src/bin/zingo-uniffi-bindgen.rs"

[dependencies]
# The workspace pin, shared by `zingo` (zingo-ffi/lib) and `zingo-nym-proxy-ffi`.
uniffi = { workspace = true, features = ["cli"] }
