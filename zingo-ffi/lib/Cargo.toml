[package]
name = "zingo"
version = "2.0.0"
authors = ["Zingolabs <zingo@zingolabs.com>"]
edition = "2024"
# The Binding Layer ships as Prebuilt Bundles and never through crates.io
# (zingo-adrs zingolib/0054), so a workspace publish passes this crate by.
publish = false

[dependencies]
zingolib = { workspace = true, features = ["nym", "perspective"] }
pepper-sync = { workspace = true }

zcash_keys = { workspace = true }
zcash_address = { workspace = true }
zcash_protocol = { workspace = true }
zcash_client_backend = { workspace = true, features = ["lightwalletd-tonic"] }
zcash_transparent = { workspace = true }
zingo_common_components = { workspace = true }

http = { workspace = true }
json = { workspace = true }
lazy_static = { workspace = true }
hex = { workspace = true }
android_logger = { workspace = true }
log = { workspace = true }
uniffi = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time"] }
serde_json = { workspace = true }
zip32 = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }
# The iOS archive carries the proxy crate's UniFFI surface beside the
# wallet's, so the app links one Rust std and one `rust_eh_personality`
# beside its C++ and Objective-C personality routines, the three that
# compact unwind encodes. The Binding Layer builder turns the feature on for
# the iOS slices alone; Android keeps the proxy as its own shared library.
zingo-nym-proxy-ffi = { workspace = true, optional = true }

[lib]
crate-type = ["cdylib", "staticlib"]
name = "zingo"

[dev-dependencies]
quote = { workspace = true }
syn = { workspace = true }

[features]
zingo-nym-proxy-ffi = ["dep:zingo-nym-proxy-ffi"]
unstable = []
