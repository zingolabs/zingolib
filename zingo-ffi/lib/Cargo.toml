[package]
name = "zingo"
version = "1.0.1"
authors = ["Zingolabs <zingo@zingolabs.com>"]
edition = "2021"

[dependencies]
zingolib = { workspace = true }

zcash_primitives = { git = "https://github.com/zingolabs/librustzcash.git", branch = "zcash_client_sqlite-0.12.1_plus_zingolabs_changes_zingo2"  }

http = "1.1.0"
lazy_static = "1.4.0"
base64 = "0.22"
android_logger = "0.11"
log = "0.4"
uniffi = { workspace = true, features = [ "cli" ] }
tokio = { workspace = true }
rustls = { workspace = true }

[build-dependencies]
uniffi_build = { version = "0.29", features = [ "builtin-bindgen" ] }

[lib]
crate-type = ["cdylib", "staticlib"]
name = "zingo"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
