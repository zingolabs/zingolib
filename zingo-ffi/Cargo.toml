[workspace]
members = ["lib", "android", "ios", "zingomobile_utils"]
resolver = "2"

[workspace.dependencies]
zingolib = { git = "https://github.com/zingolabs/zingolib", branch = "feature/swap-op-return"}
pepper-sync = { git = "https://github.com/zingolabs/zingolib", branch = "feature/swap-op-return"}
zingolib_testutils = { git = "https://github.com/zingolabs/zingolib", branch = "feature/swap-op-return", features = [
    "test_lwd_zebrad",
] }
zingomobile_utils = { path = "zingomobile_utils" }

zcash_address = "0.12.0"
zcash_client_backend = { version = "0.23.0", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
] }
zcash_encoding = "0.4.0"
zcash_keys = { version = "0.14.0", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4.1"
zcash_proofs = "0.28.0"
zcash_protocol = "0.9.0"
zcash_transparent = "0.8.0"

zingo_common_components = "0.4.0"
zingo-netutils = { version = "5.0.1", features = ["globally-public-transparent"] }

bip0039 = { version = "0.14", features = ["rand"] }
zip32 = "0.2.0"
uniffi = "0.29"
tokio = "1"
rustls = { version = "0.23.37", features = ["ring"] }
serde_json = "1"
android_logger = "0.11"
base64 = "0.22"
env_logger = "0.10.0"
http = "1"
hex = "0.4"
json = "0.12"
lazy_static = "1.4.0"
log = "0.4"
uniffi_build = "0.29"
thiserror = "1"
once_cell = "1"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"
opt-level = "z"

[profile.test]
opt-level = 3
debug = 1

[patch.crates-io]
# TEMPORARY: point to fork with OP_RETURN support for swap integrations.
# Must match the patch in zingolib so the dependency graph resolves to a single
# version of the librustzcash crates. Revert once upstream PR merges.
zcash_client_backend = { git = "https://github.com/zingolabs/librustzcash", branch = "feature/op-return-zingolib-compat" }
zcash_keys = { git = "https://github.com/zingolabs/librustzcash", branch = "feature/op-return-zingolib-compat" }
zcash_primitives = { git = "https://github.com/zingolabs/librustzcash", branch = "feature/op-return-zingolib-compat" }
zcash_protocol = { git = "https://github.com/zingolabs/librustzcash", branch = "feature/op-return-zingolib-compat" }
zcash_transparent = { git = "https://github.com/zingolabs/librustzcash", branch = "feature/op-return-zingolib-compat" }
zcash_proofs = { git = "https://github.com/zingolabs/librustzcash", branch = "feature/op-return-zingolib-compat" }
zcash_address = { git = "https://github.com/zingolabs/librustzcash", branch = "feature/op-return-zingolib-compat" }
zcash_encoding = { git = "https://github.com/zingolabs/librustzcash", branch = "feature/op-return-zingolib-compat" }
