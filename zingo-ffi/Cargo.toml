[workspace]
members = ["lib", "android", "ios", "zingomobile_utils"]
resolver = "2"

[workspace.dependencies]
zingolib = { git = "https://github.com/zingolabs/zingolib", rev = "afea8b734" }
pepper-sync = { git = "https://github.com/zingolabs/zingolib", rev = "afea8b734" }
zingolib_testutils = { git = "https://github.com/zingolabs/zingolib", rev = "afea8b734", features = [
    "test_lwd_zcashd",
] }
regchest_utils = { git = "https://github.com/zingolabs/zingo-regchest", branch = "dev" }
zingomobile_utils = { path = "zingomobile_utils" }

zcash_address = "0.12.0"
zcash_client_backend = { version = "0.23.0", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
] }
zcash_encoding = "0.4.0"
zcash_keys = { version = "0.14.0", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4.1"
zcash_proofs = "0.28.0"
zcash_protocol = "0.9.0"
zcash_transparent = "0.8.0"

zingo_common_components = "0.3.1"
zingo-netutils = { version = "5.0.1", features = ["globally-public-transparent"] }

bip0039 = { version = "0.14", features = ["rand"] }
zip32 = "0.2.0"
uniffi = "0.29"
tokio = "1"
rustls = { version = "0.23.37", features = ["ring"] }
serde_json = "1"
android_logger = "0.11"
base64 = "0.22"
env_logger = "0.10.0"
http = "1"
hex = "0.4"
json = "0.12"
lazy_static = "1.4.0"
log = "0.4"
uniffi_build = "0.29"
thiserror = "1"
once_cell = "1"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"
opt-level = "z"

[profile.test]
opt-level = 3
debug = 1
