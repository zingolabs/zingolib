[workspace]
members = ["lib", "android", "zingomobile_utils"]
resolver = "2"

[workspace.dependencies]
zingolib = { version = "0", default-features = true }
pepper-sync = "0"
uniffi = "0.29"
tokio = { version = "1.24", features = ["full"] }
rustls = { version = "0.23.13", features = ["ring"] }
serde_json = "1"

zcash_primitives = "0.22.0"
zcash_keys = { version = "0.8.0" , features = ["transparent-inputs", "sapling", "orchard" ] }
zcash_address = "0.7.0"
zcash_protocol = "0.5.1"
zcash_client_backend = { version = "0.18.0" , features = ["lightwalletd-tonic", "orchard", "transparent-inputs", "tor"] }
android_logger = "0.11"
base64 = "0.22"
#darkside-tests = { git = "https://github.com/zingolabs/zingolib", branch = "dev" }
env_logger = "0.10.0"
http = "1.1.0"
json = "0.12.4"
lazy_static = "1.4.0"
log = "0.4"
regchest_utils = { git = "https://github.com/zingolabs/zingo-regchest", branch = "dev" }
uniffi_build = "0.29"
zingomobile_utils = { path = "zingomobile_utils" }

[profile.release]
debug = false
lto = false
codegen-units = 1
overflow-checks = false

[profile.test]
opt-level = 3
debug = false
