[workspace]
members = ["lib", "android", "zingomobile_utils"]
resolver = "2"

[workspace.dependencies]
zingolib = { git = "https://github.com/zingolabs/zingolib", default-features = true, branch = "dev" }
pepper-sync = { git = "https://github.com/zingolabs/zingolib", branch = "dev" }
uniffi = "0.29"
tokio = { version = "1.24", features = ["full"] }
rustls = { version = "0.23.13", features = ["ring"] }
zcash_primitives = "0.22.0"
serde_json = "1"
zcash_keys = { version = "0.8.0" , features = ["transparent-inputs", "sapling", "orchard" ] }

[profile.release]
debug = false
lto = false
codegen-units = 1
overflow-checks = false

[profile.test]
opt-level = 3
debug = false
