[workspace]
members = [
    "lib", 
    "android", 
    "ios", 
    "zingomobile_utils"
]
resolver = "2"

[workspace.dependencies]
zingolib = { git = "https://github.com/zingolabs/zingolib", default-features = true, tag = "2.1.0", features = [ "testutils" ] }
pepper-sync = { git = "https://github.com/zingolabs/zingolib", tag = "2.1.0" }
zingolib_testutils = { git = "https://github.com/zingolabs/zingolib", tag = "2.1.0", features = ["test_lwd_zcashd"] }
regchest_utils = { git = "https://github.com/zingolabs/zingo-regchest", branch = "dev" }
zingomobile_utils = { path = "zingomobile_utils" }

zcash_address = { version = "0.10" }
zcash_client_backend = { version = "0.20", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }
zcash_encoding = { version = "0.3" }
zcash_keys = { version = "0.12", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_note_encryption = "0.4"
zcash_primitives = { version = "0.26" }
zcash_proofs = { version = "0.26" }
zcash_protocol = { version = "0.7" }
zcash_transparent = { version = "0.6" }

zebra-chain = { version = "3.0" }

zingo_common_components = { git = "https://github.com/zingolabs/zingo-common.git", branch = "dev" }

bip0039 = { version = "0.12", features = [ "rand" ] }
uniffi = "0.29"
tokio = "1"
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1"
android_logger = "0.11"
base64 = "0.22"
env_logger = "0.10.0"
http = "1"
hex = "0.4"
json = "0.12"
lazy_static = "1.4.0"
log = "0.4"
uniffi_build = "0.29"
thiserror = "1"
once_cell = "1"

[patch.crates-io]
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "3ba772c9b8"}
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "3ba772c9b8"}
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "3ba772c9b8"}
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "3ba772c9b8"}
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "3ba772c9b8"}
zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "3ba772c9b8"}

[profile.release]
debug = 1
lto = false
codegen-units = 1
overflow-checks = false

[profile.test]
opt-level = 3
debug = false
