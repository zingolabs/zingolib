[package]
name = "zingo-price"
description = "Crate for fetching ZEC prices."
authors = ["<zingo@zingolabs.org>"]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/zingolabs/zingolib"
homepage = "https://github.com/zingolabs/zingolib"
license = "MIT"

[features]
# The fetch path, and the ONLY way this crate performs network requests: a
# SOCKS5 proxy address is required, so a price is never fetched over
# clearnet (ADR 0011, amendment 2026-07-23). Off by default — without it
# the crate is price types and storage only, with no network dependencies.
# zingolib's `nym` feature forwards this one.
socks5-fetch = [
    "dep:reqwest",
    "dep:rust_decimal",
    "dep:rustls",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
zcash_encoding = { workspace = true }

byteorder = { workspace = true }
# rustls-tls-webpki-roots-no-provider: never auto-selects a rustls
# CryptoProvider (the fetch path installs aws-lc-rs, first-install-wins,
# before requesting), and verifies against the compiled-in Mozilla webpki
# bundle — the same root decision as ADR 0021. The former bare
# rustls-tls-no-provider resolved to MANUAL roots: an empty trust store
# that failed every handshake with UnknownIssuer, buried three Display
# layers deep (zingolib#2531 follow-up).
reqwest = { workspace = true, optional = true, default-features = false, features = [
    "cookies",
    "rustls-tls-webpki-roots-no-provider",
    "json",
    "socks",
] }
rust_decimal = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
