[package]
name = "zingo-price"
description = "Crate for fetching ZEC prices."
authors = ["<zingo@zingolabs.org>"]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/zingolabs/zingolib"
homepage = "https://github.com/zingolabs/zingolib"
license = "MIT"

[dependencies]
zcash_encoding = { workspace = true }

byteorder = { workspace = true }
# rustls-tls-no-provider: never auto-selects a rustls CryptoProvider; the
# fetch path installs aws-lc-rs (first-install-wins) before requesting. The
# `socks` feature backs the optional Nym mixnet route (ADR 0011); the fetch
# defaults to clearnet.
reqwest = { workspace = true, default-features = false, features = [
    "cookies",
    "rustls-tls-no-provider",
    "json",
    "socks",
] }
rust_decimal = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
