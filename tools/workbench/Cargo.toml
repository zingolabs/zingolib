# Standalone dev-tooling crate: its own workspace (not a member of the root one)
# so building a single tiny, std-only binary never drags in the production
# dependency graph. One binary per `src/bin/*.rs`; shared logic in `src/lib.rs`.
[package]
name = "workbench"
version = "0.0.0"
edition = "2021"
publish = false

# The orasust release the Binding Layer workflows install and the workbench
# requires. The pin lives in this manifest rather than in source because
# rust-cache hashes the manifest into its cache key: a bump misses the cache
# once and the newly installed binary is saved under the new key.
[package.metadata.orasust]
version = "0.1.3"

# Own workspace root -> isolated resolution, independent of the production tree.
[workspace]

# Crate-wide: forbid unsafe across the lib and every binary in one place.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
# The generic helpers live in the repository's xtask crate; every binary here
# calls them through the re-exports in src/lib.rs.
xtask = { path = "../../xtask" }
toml_edit = "0.25.17"
